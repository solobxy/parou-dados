name: Capturas da app (imprensa)
on:
  push:
    branches: [capturas-funchal]
permissions:
  contents: write
jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Capturar
        run: |
          cd .github/capturas && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node capturar.mjs || true
      - name: Guardar
        if: always()
        run: |
          mkdir -p pub && cp -r .github/capturas/res/* pub/ 2>/dev/null || echo vazio > pub/vazio.txt
          cd pub && git init -q -b capturas-funchal-resultado
          git config user.name "parou-dados"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "capturas $(date -u +%H:%MZ)" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas-funchal-resultado
