name: Barraqueiro Oeste (amostra das fontes)

# Descarrega os horários em PDF da Barraqueiro Oeste e as paragens do OpenStreetMap na zona de Torres Vedras,
# para construir e testar o conversor PDF -> GTFS (barraqueiro_oeste.py).
# Resultado no ramo "barraqueiro-resultado".

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  amostra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ferramentas
        run: sudo apt-get install -y -qq poppler-utils >/dev/null

      - name: PDFs e texto
        continue-on-error: true
        run: |
          mkdir -p res/pdf res/txt
          curl -sSL -w "pagina: %{http_code} %{size_download}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0 Safari/537.36" https://barraqueiro-oeste.pt/horarios-em-pdf/ -o res/pagina.html 2>&1 | tee res/log-pdfs.txt || true
          grep -o 'wp-content/uploads/[^"]*/[0-9][^"/]*\.pdf' res/pagina.html | sed 's#^#https://barraqueiro-oeste.pt/#' | sort -u > res/pdfs.txt || true
          wc -l res/pdfs.txt
          while read -r u; do
            n=$(basename "$u" .pdf)
            curl -sSL -w "$n: %{http_code} %{size_download}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0 Safari/537.36" "$u" -o "res/pdf/$n.pdf" 2>&1 | tee -a res/log-pdfs.txt || continue
            pdftotext -layout "res/pdf/$n.pdf" "res/txt/$n.layout.txt" || true
            pdftotext -bbox-layout "res/pdf/$n.pdf" "res/txt/$n.bbox.html" || true
            pdfinfo "res/pdf/$n.pdf" > "res/txt/$n.info.txt" || true
          done < res/pdfs.txt
          ls -la res/txt | head -80

      - name: Paragens e linhas do OpenStreetMap (Oeste)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq osmium-tool >/dev/null
          curl -fsSL --retry 3 --retry-delay 10 -o portugal.osm.pbf https://download.geofabrik.de/europe/portugal-latest.osm.pbf
          osmium extract -b -9.45,38.95,-9.05,39.35 portugal.osm.pbf -o oeste.osm.pbf --overwrite
          osmium tags-filter oeste.osm.pbf n/highway=bus_stop n/public_transport=platform,stop_position -o paragens.osm.pbf --overwrite
          osmium export paragens.osm.pbf -f geojsonseq -a type,id -x print_record_separator=false -o res/osm-paragens.geojsonseq --overwrite
          osmium tags-filter -R oeste.osm.pbf r/route=bus -o rotas.osm.pbf --overwrite
          osmium cat rotas.osm.pbf -t relation -f opl -o res/osm-rotas.opl --overwrite
          wc -l res/osm-paragens.geojsonseq res/osm-rotas.opl

      - name: Publicar resultado
        if: always()
        run: |
          mkdir -p pub && cp -r res/* pub/
          cd pub && git init -q -b barraqueiro-resultado
          git config user.name "parou-dados"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Amostra Barraqueiro Oeste $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" barraqueiro-resultado
