name: Duas Chaves - sonda de fontes

# Lê o robots.txt e uma página de pesquisa de cada site candidato (duaschaves/sonda-urls.txt)
# e guarda tudo no ramo duaschaves-sonda-resultado, para estudar antes de escrever um recolhedor.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sondar
        run: python3 duaschaves/sonda.py duaschaves/sonda-urls.txt 2>&1 | tee sonda-registo.txt
      - name: Guardar
        if: always()
        run: |
          mkdir pub && cp -r sonda pub/ 2>/dev/null; cp sonda-registo.txt pub/ 2>/dev/null; cd pub && git init -q -b duaschaves-sonda-resultado
          git config user.name "parou-dados"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Sonda $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" duaschaves-sonda-resultado
