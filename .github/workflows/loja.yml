name: Imagens para a Play Store

# Tira as capturas de ecrã da app a partir do site em produção (1080x1920, como pede a Google),
# faz as versões com legenda, a imagem de destaque (1024x500) e a imagem para partilhas (1200x630).
# O script está em android/loja/fazer.cjs. Resultado na release "loja" (JPEG, sem transparência).

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Endereço do site"
        required: false
        default: "https://parou.pt"

permissions:
  contents: write

jobs:
  loja:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Capturas e imagens
        run: |
          mkdir -p trabalho && cd trabalho && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          SITE="${{ inputs.site }}" SAIDA="$PWD/saida" node ../android/loja/fazer.cjs
          curl -fsSL "${{ inputs.site }}/icon-512.png" -o saida/icone-512.png
          ls -la saida
      - name: Publicar
        working-directory: trabalho/saida
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view loja -R ${{ github.repository }} >/dev/null 2>&1 || gh release create loja -R ${{ github.repository }} --title "Imagens para a Play Store" --notes "Capturas 1080x1920 e imagem de destaque 1024x500."
          # Tira as imagens antigas (as de antes da app mudar)
          for f in $(gh release view loja -R ${{ github.repository }} --json assets --jq '.assets[].name'); do
            case "$f" in *.png|*.jpg) [ "$f" = "icone-512.png" ] || gh release delete-asset loja "$f" -R ${{ github.repository }} -y ;; esac
          done
          gh release upload loja -R ${{ github.repository }} *.jpg icone-512.png --clobber
