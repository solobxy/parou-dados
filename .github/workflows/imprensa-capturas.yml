name: Capturas para imprensa

# Abre o parou.pt (produção) num telemóvel simulado e tira capturas em alta resolução para o kit de imprensa.
# Resultado no ramo "imprensa-capturas".

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capturar
        working-directory: auditoria
        run: |
          npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          mkdir -p ../res && SAIDA=../res timeout 600 node imprensa-capturas.mjs 2>&1 | tail -40
      - name: Guardar
        if: always()
        run: |
          mkdir -p pub && cp -r res/* pub/ 2>/dev/null || echo "sem resultados" > pub/vazio.txt
          cd pub && git init -q -b imprensa-capturas
          git config user.name "parou-dados"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Capturas $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" imprensa-capturas
