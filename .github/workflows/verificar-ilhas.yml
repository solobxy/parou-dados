name: Verificar ilhas (Madeira e Açores)
on:
  push:
    branches: [verificar-ilhas]
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recolher API e fontes
        run: cd .github/ilhas && mkdir -p res && bash recolher.sh 2>&1 | tee res/log-recolha.txt
      - name: Capturas
        run: |
          cd .github/ilhas && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node capturar.mjs || true
      - name: Guardar
        if: always()
        run: |
          mkdir -p pub && cp -r .github/ilhas/res/* pub/ 2>/dev/null || echo vazio > pub/vazio.txt
          cd pub && git init -q -b verificar-ilhas-resultado
          git config user.name "parou-dados"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "ilhas $(date -u +%H:%MZ)" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" verificar-ilhas-resultado
