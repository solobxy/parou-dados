name: Vigiar o site

# De 15 em 15 minutos, testa de fora se a PAROU está a responder e a mostrar paragens.
# Só falha (e o GitHub manda um email) se falhar 3 vezes seguidas em ~3 minutos, ou seja,
# quando há mesmo um problema (o servidor também se reinicia sozinho se a app bloquear).

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Testar o site
        run: |
          testar() {
            base="$1"
            curl -fsS -m 20 "$base/health" >/dev/null || { echo "$base/health não respondeu"; return 1; }
            n=$(curl -fsS -m 40 "$base/api/transit/nearby?lat=38.7107&lon=-9.1365&radius=800" | python3 -c "import json,sys; print(len(json.load(sys.stdin).get('stops') or []))" 2>/dev/null || echo 0)
            [ "$n" -gt 0 ] || { echo "$base: Perto sem paragens na Baixa de Lisboa"; return 1; }
            echo "$base OK ($n paragens perto da Baixa)"
          }
          sites="https://2-31-13-85.sslip.io"
          # Quando o domínio já aponta para o servidor, testa também o parou.pt
          if [ "$(dig +short A parou.pt @1.1.1.1 | head -1)" = "2.31.13.85" ]; then sites="$sites https://parou.pt"; fi
          falhou=0
          for s in $sites; do
            ok=0
            for i in 1 2 3; do
              if testar "$s"; then ok=1; break; fi
              sleep 60
            done
            [ $ok = 1 ] || falhou=1
          done
          echo "Sites testados: $sites" >> "$GITHUB_STEP_SUMMARY"
          exit $falhou

  # Os outros sites: cada um tem de abrir e mostrar a sua marca. Os dados automáticos têm de estar frescos
  # (preços do caiu.pt de hoje, anúncios da DupliCasa a mexer). O servidor já se corrige sozinho
  # (vigia-projetos.sh); isto só avisa por email se algo continuar partido.
  outros:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Testar os outros sites
        run: |
          testar() { # url texto
            curl -fsSL -m 25 "$1" -o /tmp/p.html || { echo "$1 não abriu"; return 1; }
            grep -qi "$2" /tmp/p.html || { echo "$1 abriu sem «$2»"; return 1; }
            echo "$1 OK"
          }
          falhou=0
          while read -r url texto; do
            [ -n "$url" ] || continue
            ok=0; for i in 1 2 3; do if testar "$url" "$texto"; then ok=1; break; fi; sleep 40; done
            [ $ok = 1 ] || falhou=1
          done <<'LISTA'
          https://dinissousa.pt/ dinissousa
          https://duplicasa.pt/ DupliCasa
          https://caiu.pt/ caiu
          https://ganhas.pt/ ganhas
          https://tapmoss.com/ tapmoss
          https://goodman.pt/ Goodman
          https://anjinho.pt/ anjinho
          https://jinxed.world/ jinxed
          https://adribodypiercing.pt/ Adri
          LISTA
          # caiu.pt: os preços têm de ser de hoje ou de ontem (há 3 recolhas por dia)
          dia=$(curl -fsS -m 25 https://caiu.pt/dados/resumo.json | python3 -c "import json,sys; print(json.load(sys.stdin).get('dia',''))" 2>/dev/null || true)
          hoje=$(TZ=Europe/Lisbon date +%F); ontem=$(TZ=Europe/Lisbon date -d yesterday +%F)
          if [ "$dia" = "$hoje" ] || [ "$dia" = "$ontem" ]; then echo "caiu.pt preços de $dia"; else echo "caiu.pt: preços velhos ($dia)"; falhou=1; fi
          exit $falhou
