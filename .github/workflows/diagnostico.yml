name: Diagnóstico da app

# Só corre quando é lançado à mão. Faz à app os mesmos pedidos que o telemóvel faz,
# várias vezes seguidas, e guarda o resultado (código HTTP, tempo, tamanho e início
# da resposta) no ramo "diagnostico", em resultado.txt.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pedir os endereços da app
        run: |
          base="https://paroupt.ai.studio"
          out="$PWD/resultado.txt"
          : > "$out"
          for volta in $(seq 1 12); do
            echo "===== Volta $volta ($(date -u +%H:%M:%S) UTC) =====" >> "$out"
            for caminho in \
              "/api/transit/loading-status" \
              "/api/transit/nearby?lat=41.1486&lon=-8.5856&radius=500&_t=$RANDOM" \
              "/api/lines?near=41.1486,-8.5856&r=800" \
              "/api/lines?page=1" \
              "/api/transit/nearby?lat=38.7139&lon=-9.1394&radius=500&_t=$RANDOM"; do
              res=$(curl -s -D cab.txt -o corpo.txt -w "%{http_code} %{time_total}s %{size_download}B" --max-time 30 "$base$caminho" || echo "falhou(curl $?)")
              extra=$(grep -iE "^(retry-after|x-cloud-trace|server|via|x-served-by|content-type):" cab.txt 2>/dev/null | tr -d '\r' | tr '\n' ' ')
              echo "--- $caminho -> $res | $extra" >> "$out"
              head -c 220 corpo.txt 2>/dev/null | tr '\n' ' ' >> "$out"; echo >> "$out"
            done
            sleep 8
          done
          cat "$out"

      - name: Guardar o resultado no ramo diagnostico
        run: |
          mkdir pub && cd pub && git init -q -b diagnostico
          cp ../resultado.txt .
          git config user.name "parou-dados"
          git config user.email "actions@users.noreply.github.com"
          git add resultado.txt && git commit -q -m "Diagnóstico $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diagnostico
