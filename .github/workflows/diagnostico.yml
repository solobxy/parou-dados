name: Diagnóstico da app

# Só corre quando é lançado à mão. Pede os endereços principais da app e mostra
# o código HTTP, o tempo de resposta e o início de cada resposta.

on:
  workflow_dispatch:

permissions: {}

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pedir os endereços da app
        run: |
          base="https://paroupt.ai.studio"
          for volta in 1 2 3; do
            echo "===== Volta $volta ($(date -u +%H:%M:%S) UTC) ====="
            for caminho in \
              "/robots.txt" \
              "/health" \
              "/api/transit/loading-status" \
              "/api/lines?page=1" \
              "/api/transit/nearby?lat=41.1486&lon=-8.5856&radius=400" \
              "/api/lines?near=41.1486,-8.5856&r=500" \
              "/api/transit/nearby?lat=38.7139&lon=-9.1394&radius=400"; do
              res=$(curl -s -o corpo.txt -w "%{http_code} %{time_total}s %{content_type}" --max-time 45 "$base$caminho" || echo "falhou")
              echo "--- $caminho -> $res"
              head -c 400 corpo.txt 2>/dev/null; echo
            done
            sleep 20
          done
