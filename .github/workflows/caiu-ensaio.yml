name: Caiu - ensaio do topo novo

on:
  push:
    branches: [caiu-ensaio]

permissions:
  contents: write

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Playwright
        run: pip install -q playwright && python3 -m playwright install --with-deps chromium >/dev/null
      - name: Esperar pela versão nova e tirar capturas
        timeout-minutes: 9
        run: python3 capturas.py https://caiu.pt/ | tee resultado.txt
      - name: Guardar
        if: always()
        run: |
          mkdir -p pub && cp -r saida/* resultado.txt pub/ 2>/dev/null || true
          cd pub && git init -q -b caiu-ensaio-resultado
          git config user.name "parou-dados"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Ensaio $(date -u +%H:%MZ)" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" caiu-ensaio-resultado
