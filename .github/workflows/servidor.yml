name: Servidor (Hetzner)

# Gere o servidor próprio na Hetzner através da API (segredo HCLOUD_TOKEN).
#   estado   - mostra o servidor e corre um diagnóstico por SSH
#   recriar  - apaga o servidor "parou" e cria um novo (CX23, Ubuntu 24.04) com a chave SSH
#              deste repositório e a instalação automática; acompanha a instalação até ao fim
#   comando  - corre um comando no servidor por SSH
#   chaves   - copia chaves de APIs guardadas como segredos do GitHub (ex.: FOGOS_API_KEY)
#              para /etc/parou.env no servidor e reinicia a app (nunca aparecem no resultado)
#   chaves-duplicasa - copia os segredos da DupliCasa guardados no GitHub (GOOGLE_ID, GOOGLE_SEGREDO,
#              FACEBOOK_ID, FACEBOOK_SEGREDO, RESEND_API_KEY) para /etc/duaschaves/api.env e reinicia
#              só a API da DupliCasa (o PAROU não é tocado)
#   chaves-adri - põe o hash da password da agenda do AdriBodyPiercing (servidor/adri-agenda.age, cifrado
#              para a chave SSH do servidor) em /etc/adri-agenda/agenda.env e reinicia só a agenda
# O resultado fica no ramo "servidor-resultado", em resultado.txt.
#
# A chave SSH privada fica em servidor/chave-ssh.enc, cifrada com o HCLOUD_TOKEN
# (quem não tem o token não a consegue ler; quem tem o token já controla o servidor).

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "estado, recriar, comando, chaves, chaves-duplicasa ou chaves-adri"
        required: true
        default: "estado"
      comando:
        description: "Comando a correr no servidor (só para acao=comando)"
        required: false
        default: "uptime"

permissions:
  contents: write

concurrency:
  group: servidor
  cancel-in-progress: false

jobs:
  servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      API: https://api.hetzner.cloud/v1
    steps:
      - uses: actions/checkout@v4

      - name: Preparar
        run: |
          if [ -z "$HCLOUD_TOKEN" ]; then echo "Falta o segredo HCLOUD_TOKEN" | tee resultado.txt; exit 1; fi
          echo "== $(date -u +%Y-%m-%dT%H:%M:%SZ) acao=${{ inputs.acao }}" > resultado.txt
          h() { curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" -H "Content-Type: application/json" "$@"; }
          declare -f h > funcs.sh
          # Chave SSH: usa a do repositório ou cria uma nova
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -f servidor/chave-ssh.enc ] && (umask 077; openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:HCLOUD_TOKEN -in servidor/chave-ssh.enc -out ~/.ssh/id_ed25519 2>/dev/null) && chmod 600 ~/.ssh/id_ed25519 && ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            cp servidor/chave-ssh.pub ~/.ssh/id_ed25519.pub
          else
            # Não há chave ou foi cifrada com outro token: cria uma nova
            rm -f ~/.ssh/id_ed25519 ~/.ssh/id_ed25519.pub
            ssh-keygen -q -t ed25519 -N "" -C "github-parou" -f ~/.ssh/id_ed25519
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:HCLOUD_TOKEN -in ~/.ssh/id_ed25519 -out servidor/chave-ssh.enc
            cp ~/.ssh/id_ed25519.pub servidor/chave-ssh.pub
            git config user.name "parou-dados"; git config user.email "actions@users.noreply.github.com"
            git add servidor/chave-ssh.enc servidor/chave-ssh.pub
            git commit -q -m "Chave SSH do servidor (cifrada)" && git pull -q --rebase && git push -q
          fi
          printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n  LogLevel ERROR\n  ConnectTimeout 15\n' > ~/.ssh/config

      - name: Recriar o servidor
        if: inputs.acao == 'recriar'
        run: |
          source funcs.sh
          PUB=$(cat ~/.ssh/id_ed25519.pub)
          # Regista a chave SSH na Hetzner (reaproveita se já existir)
          KID=$(h "$API/ssh_keys?name=github-parou" | jq -r '.ssh_keys[0].id // empty')
          if [ -n "$KID" ] && [ "$(h "$API/ssh_keys/$KID" | jq -r .ssh_key.public_key)" != "$PUB" ]; then
            h -X DELETE "$API/ssh_keys/$KID"; KID=""
          fi
          if [ -z "$KID" ]; then
            R=$(curl -sS -H "Authorization: Bearer $HCLOUD_TOKEN" -H "Content-Type: application/json" -X POST "$API/ssh_keys" -d "$(jq -n --arg k "$PUB" '{name:"github-parou", public_key:$k}')")
            KID=$(echo "$R" | jq -r '.ssh_key.id // empty')
            if [ -z "$KID" ]; then echo "ERRO ao registar a chave SSH: $(echo "$R" | jq -c .error)" >> resultado.txt; exit 1; fi
          fi
          echo "Chave SSH na Hetzner: $KID" >> resultado.txt
          # Apaga o servidor antigo
          for id in $(h "$API/servers?name=parou" | jq -r '.servers[].id'); do
            echo "A apagar o servidor $id" >> resultado.txt
            R=$(curl -sS -H "Authorization: Bearer $HCLOUD_TOKEN" -X DELETE "$API/servers/$id")
            if echo "$R" | jq -e .error >/dev/null 2>&1; then echo "ERRO ao apagar: $(echo "$R" | jq -c .error)" >> resultado.txt; exit 1; fi
          done
          sleep 20
          # Cria o novo (tenta Nuremberga, Falkenstein e Helsínquia)
          UD=$(printf '#cloud-config\nruncmd:\n  - curl -fsSL https://raw.githubusercontent.com/solobxy/parou-dados/main/servidor/instalar.sh -o /root/instalar.sh\n  - bash /root/instalar.sh\n')
          for loc in nbg1 fsn1 hel1; do
            BODY=$(jq -n --arg ud "$UD" --arg loc "$loc" --argjson k "$KID" \
              '{name:"parou", server_type:"cx23", image:"ubuntu-24.04", location:$loc, ssh_keys:[$k], user_data:$ud, public_net:{enable_ipv4:true, enable_ipv6:true}}')
            R=$(curl -sS -H "Authorization: Bearer $HCLOUD_TOKEN" -H "Content-Type: application/json" -X POST "$API/servers" -d "$BODY")
            IP=$(echo "$R" | jq -r '.server.public_net.ipv4.ip // empty')
            if [ -n "$IP" ]; then echo "Servidor criado em $loc com o IP $IP" >> resultado.txt; break; fi
            echo "Não deu em $loc: $(echo "$R" | jq -c .error)" >> resultado.txt
          done
          [ -n "$IP" ] || exit 1
          echo "$IP" > ip.txt
          # Espera pelo SSH e acompanha a instalação
          for i in $(seq 1 60); do ssh root@$IP true 2>/dev/null && break; sleep 10; done
          for i in $(seq 1 120); do
            if ssh root@$IP "grep -q 'PAROU.PT instalado' /var/log/parou-instalar.log 2>/dev/null"; then echo "Instalação terminada." >> resultado.txt; break; fi
            if ssh root@$IP "cloud-init status 2>/dev/null | grep -qE 'done|error'"; then echo "cloud-init terminou: $(ssh root@$IP cloud-init status)" >> resultado.txt; break; fi
            sleep 15
          done

      - name: Chaves de APIs para o servidor
        if: inputs.acao == 'chaves'
        env:
          FOGOS_API_KEY: ${{ secrets.FOGOS_API_KEY }}
        run: |
          source funcs.sh
          IP=$(h "$API/servers?name=parou" | jq -r '.servers[0].public_net.ipv4.ip // empty')
          [ -n "$IP" ] || { echo "Servidor não encontrado" >> resultado.txt; exit 1; }
          # Sem segredo no GitHub, usa a chave cifrada guardada no repositório (age, para a chave SSH
          # do servidor: só quem tem o HCLOUD_TOKEN a consegue abrir).
          if [ -z "$FOGOS_API_KEY" ] && [ -f servidor/fogos.age ]; then
            sudo apt-get install -y -qq age >/dev/null 2>&1
            FOGOS_API_KEY=$(age -d -i ~/.ssh/id_ed25519 servidor/fogos.age 2>/dev/null) || FOGOS_API_KEY=""
          fi
          # STCP (API oficial de tempo real): credenciais cifradas em servidor/stcp.age (linha 1 = app-id, linha 2 = chave)
          if [ -f servidor/stcp.age ]; then
            command -v age >/dev/null 2>&1 || sudo apt-get install -y -qq age >/dev/null 2>&1
            STCP_DADOS=$(age -d -i ~/.ssh/id_ed25519 servidor/stcp.age 2>/dev/null) || STCP_DADOS=""
            STCP_APP_ID=$(printf '%s' "$STCP_DADOS" | sed -n 1p)
            STCP_API_KEY=$(printf '%s' "$STCP_DADOS" | sed -n 2p)
          fi
          for NOME in FOGOS_API_KEY STCP_APP_ID STCP_API_KEY; do
            VALOR="${!NOME}"
            if [ -z "$VALOR" ]; then echo "$NOME: sem segredo no GitHub (nada a fazer)" >> resultado.txt; continue; fi
            # Passa o valor pelo stdin (não aparece em comandos nem no resultado)
            printf '%s' "$VALOR" | ssh root@$IP "V=\$(cat); grep -v '^$NOME=' /etc/parou.env > /etc/parou.env.novo; echo \"$NOME=\$V\" >> /etc/parou.env.novo; chmod 600 /etc/parou.env.novo; mv /etc/parou.env.novo /etc/parou.env"
            echo "$NOME: copiada para o servidor" >> resultado.txt
          done
          ssh root@$IP "systemctl restart parou" && echo "App reiniciada" >> resultado.txt

      - name: Segredos da DupliCasa para o servidor
        if: inputs.acao == 'chaves-duplicasa'
        env:
          GOOGLE_ID: ${{ secrets.GOOGLE_ID }}
          GOOGLE_SEGREDO: ${{ secrets.GOOGLE_SEGREDO }}
          FACEBOOK_ID: ${{ secrets.FACEBOOK_ID }}
          FACEBOOK_SEGREDO: ${{ secrets.FACEBOOK_SEGREDO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          source funcs.sh
          IP=$(h "$API/servers?name=parou" | jq -r '.servers[0].public_net.ipv4.ip // empty')
          [ -n "$IP" ] || { echo "Servidor não encontrado" >> resultado.txt; exit 1; }
          N=0
          for NOME in GOOGLE_ID GOOGLE_SEGREDO FACEBOOK_ID FACEBOOK_SEGREDO RESEND_API_KEY; do
            VALOR="${!NOME}"
            if [ -z "$VALOR" ]; then echo "$NOME: sem segredo no GitHub (fica como está)" >> resultado.txt; continue; fi
            # Passa o valor pelo stdin (não aparece em comandos nem no resultado); mantém o dono e as permissões
            printf '%s' "$VALOR" | ssh root@$IP "V=\$(cat); F=/etc/duaschaves/api.env; touch \$F; grep -v '^$NOME=' \$F > \$F.novo; echo \"$NOME=\$V\" >> \$F.novo; chown root:parou \$F.novo; chmod 640 \$F.novo; mv \$F.novo \$F"
            echo "$NOME: copiado para o servidor" >> resultado.txt; N=$((N+1))
          done
          if [ "$N" -gt 0 ]; then
            ssh root@$IP "systemctl restart duaschaves-api && sleep 2 && systemctl is-active duaschaves-api" >> resultado.txt 2>&1
          fi

      - name: Password da agenda do AdriBodyPiercing para o servidor
        if: inputs.acao == 'chaves-adri'
        run: |
          source funcs.sh
          IP=$(h "$API/servers?name=parou" | jq -r '.servers[0].public_net.ipv4.ip // empty')
          [ -n "$IP" ] || { echo "Servidor não encontrado" >> resultado.txt; exit 1; }
          command -v age >/dev/null 2>&1 || sudo apt-get install -y -qq age >/dev/null 2>&1
          VALOR=$(age -d -i ~/.ssh/id_ed25519 servidor/adri-agenda.age 2>/dev/null) || VALOR=""
          if [ -z "$VALOR" ]; then echo "ADRI_SENHA_HASH: não deu para abrir servidor/adri-agenda.age" >> resultado.txt; exit 1; fi
          # Só o hash (scrypt) e pelo stdin: nunca aparece em comandos nem no resultado
          printf '%s' "$VALOR" | ssh root@$IP "V=\$(cat); install -d -m 750 -o root -g parou /etc/adri-agenda; F=/etc/adri-agenda/agenda.env; touch \$F; grep -v '^ADRI_SENHA_HASH=' \$F > \$F.novo; echo \"ADRI_SENHA_HASH=\$V\" >> \$F.novo; chown root:parou \$F.novo; chmod 640 \$F.novo; mv \$F.novo \$F"
          echo "ADRI_SENHA_HASH: copiado para o servidor" >> resultado.txt
          ssh root@$IP "systemctl restart adri-agenda 2>&1; sleep 2; systemctl is-active adri-agenda; curl -s -m 5 http://127.0.0.1:3120/api/saude; echo; grep -c '^ADRI_SENHA_HASH=scrypt:' /etc/adri-agenda/agenda.env; grep -c '^ORIGENS=' /etc/adri-agenda/agenda.env" >> resultado.txt 2>&1

      - name: Diagnóstico ou comando
        if: always()
        run: |
          source funcs.sh
          IP=$(cat ip.txt 2>/dev/null || h "$API/servers?name=parou" | jq -r '.servers[0].public_net.ipv4.ip // empty')
          echo "IP: $IP" >> resultado.txt
          [ -n "$IP" ] || exit 0
          if [ "${{ inputs.acao }}" = "comando" ]; then
            CMD=$(cat <<'FIM'
          ${{ inputs.comando }}
          FIM
            )
          else
            CMD='echo "== Sistema"; lsb_release -ds; uptime; free -m | head -2; df -h / | tail -1
                 echo "== cloud-init"; cloud-init status --long 2>&1 | head -8
                 echo "== Serviços"; systemctl is-active parou caddy parou-atualizar.timer
                 echo "== Estado"; cat /var/lib/parou-estado/estado.txt 2>/dev/null | head -12
                 echo "== Fim da instalação"; tail -n 40 /var/log/parou-instalar.log 2>/dev/null
                 echo "== Erros do cloud-init"; grep -iE "error|fail" /var/log/cloud-init-output.log 2>/dev/null | tail -n 15
                 echo "== App"; journalctl -u parou -n 30 --no-pager -o cat 2>/dev/null | cut -c1-250
                 echo "== Pedidos locais"; for c in /health /api/transit/loading-status "/api/transit/nearby?lat=38.7253&lon=-9.15&radius=1000"; do curl -s -o /dev/null -w "$c %{http_code} %{time_total}s\n" -m 60 "http://127.0.0.1:3000$c"; done
                 echo "== Caddy"; journalctl -u caddy -n 10 --no-pager -o cat 2>/dev/null | cut -c1-250'
          fi
          echo "== Saída no servidor" >> resultado.txt
          ssh root@$IP "$CMD" >> resultado.txt 2>&1 || echo "(o comando terminou com erro ou não houve ligação SSH)" >> resultado.txt
          echo "== Teste de fora" >> resultado.txt
          H="${IP//./-}.sslip.io"
          for u in "https://$H/health" "https://$H/api/transit/loading-status"; do
            curl -s -o /dev/null -w "$u %{http_code} %{time_total}s\n" -m 30 "$u" >> resultado.txt 2>&1 || echo "$u falhou" >> resultado.txt
          done
          cat resultado.txt

      - name: Guardar o resultado
        if: always()
        run: |
          mkdir pub && cp resultado.txt pub/ && cd pub && git init -q -b servidor-resultado
          git config user.name "parou-dados"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Servidor ${{ inputs.acao }} $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" servidor-resultado
