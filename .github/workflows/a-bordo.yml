name: Teste dos autocarros em direto, do «A bordo» e dos temas

# Compila a app (solobxy/parou), verifica os tipos, corre o teste do detetor «Está a bordo do …?» e, num browser simulado (Chromium e WebKit),
# um mundo simulado: autocarro + GPS a andar juntos, a pé, «Não», «Não perguntar mais», tocar num autocarro, e os 4 temas em 320/390/1280 px.
# Resultado (capturas, resultado.json, erros de tipos) no ramo "a-bordo-resultado".

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit ou ramo de solobxy/parou"
        required: false
        default: "auditoria"
      rapido:
        description: "1 = só temas e tamanhos (sem as simulações longas)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  a-bordo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: solobxy/parou
          ref: ${{ inputs.ref }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compilar a app e verificar os tipos
        working-directory: app
        run: |
          npm ci --no-audit --no-fund --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps
          npx tsc --noEmit -p . > ../tipos.txt 2>&1 || true
          echo "linhas de erro de tipos: $(wc -l < ../tipos.txt)"
          head -60 ../tipos.txt
          npm run build 2>&1 | tail -25

      - name: Teste do detetor
        continue-on-error: true
        working-directory: app
        run: |
          mkdir -p ../res
          APP=$PWD node --import tsx ../auditoria/a-bordo-detetor.mjs 2>&1 | tee ../res/detetor.txt | tail -60

      - name: Arrancar a app
        working-directory: app
        run: |
          mkdir -p dados
          NODE_ENV=production PORT=3000 PAROU_DATA_DIR=$PWD/dados TZ=Europe/Lisbon FOGOS_TESTE=1 nohup node --import tsx server.ts > app.log 2>&1 &
          for i in $(seq 1 60); do curl -s -m 5 http://127.0.0.1:3000/api/transit/loading-status | grep -q '"isLoading":false' && break; sleep 5; done
          sleep 5

      - name: Instalar Playwright
        run: |
          cd auditoria && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1 >/dev/null && npx playwright install --with-deps chromium webkit >/dev/null

      - name: Testar e fotografar
        continue-on-error: true
        working-directory: auditoria
        run: |
          mkdir -p ../res
          SAIDA=../res RAPIDO=${{ inputs.rapido }} timeout 1800 node a-bordo.mjs 2>&1 | tee ../res/consola.txt | tail -250

      - name: Guardar
        if: always()
        run: |
          cp tipos.txt res/ 2>/dev/null || true
          tail -80 app/app.log > res/servidor.txt 2>/dev/null || true
          mkdir -p pub && cp -r res/* pub/ 2>/dev/null || echo "sem resultados" > pub/vazio.txt
          cd pub && git init -q -b a-bordo-resultado
          git config user.name "parou-dados"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "A bordo ${{ inputs.ref }} $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" a-bordo-resultado
