name: Capturas de ecrã da app

# Compila a app (solobxy/parou), põe-na a correr com os dados reais e tira capturas
# em tamanho de telemóvel com o Chromium. Guarda as imagens no ramo "capturas".

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit ou ramo de solobxy/parou"
        required: false
        default: "main"
      ficheiros:
        description: "Expressão para filtrar os erros de tipos (ficheiros mexidos)"
        required: false
        default: "PertoView|AlertasView|alertasEngine|linesEngine|MobileNav|Header|App.tsx|PortugalMap|useUserLocation|HorariosView|transitFormatter"

permissions:
  contents: write

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: solobxy/parou
          ref: ${{ inputs.ref }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compilar a app
        working-directory: app
        run: |
          npm ci --no-audit --no-fund --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps
          npm run build

      - name: Arrancar a app
        working-directory: app
        run: |
          mkdir -p dados
          NODE_ENV=production PORT=3000 PAROU_DATA_DIR=$PWD/dados TZ=Europe/Lisbon FOGOS_TESTE=1 nohup node --import tsx server.ts > app.log 2>&1 &
          for i in $(seq 1 60); do curl -s -m 5 http://127.0.0.1:3000/api/transit/loading-status | grep -q '"isLoading":false' && break; sleep 5; done
          curl -s http://127.0.0.1:3000/api/transit/loading-status

      - name: Verificar tipos (ficheiros mexidos)
        working-directory: app
        continue-on-error: true
        run: |
          npx tsc --noEmit -p . > ../tipos-todos.txt 2>&1 || true
          grep -E "${{ inputs.ficheiros }}" ../tipos-todos.txt > ../tipos.txt || echo "sem erros de tipos nesses ficheiros" > ../tipos.txt
          echo "total de linhas de erro no projeto: $(wc -l < ../tipos-todos.txt)" >> ../tipos.txt

      - name: Respostas da API
        run: |
          sleep 25
          mkdir -p cap
          curl -s -m 60 "http://127.0.0.1:3000/api/alertas?area=PTO" -o cap/alertas-porto.json || true
          curl -s -m 60 "http://127.0.0.1:3000/api/alertas?lat=38.7253&lon=-9.15" -o cap/alertas-lisboa.json || true
          curl -s -m 60 "http://127.0.0.1:3000/api/lines?near=41.1522,-8.5042&r=800" -o cap/linhas-spc.json || true
          curl -s -m 60 "http://127.0.0.1:3000/api/transit/nearby?lat=41.1435&lon=-8.4947&radius=1000" -o cap/perto-spc.json || true
          curl -s -m 60 "http://127.0.0.1:3000/api/transit/nearby?lat=38.7107&lon=-9.1365&radius=1000" -o cap/perto-baixa.json || true
          curl -s -m 60 "http://127.0.0.1:3000/api/mapa" -o cap/mapa.json || true
          curl -s -m 60 "http://127.0.0.1:3000/api/incendios" -o cap/incendios.json || true
          curl -s -m 30 "http://127.0.0.1:3000/manifest.webmanifest" -o cap/manifest.json || true
          (grep -o '<link[^>]*manifest[^>]*>' app/dist/index.html; grep -o 'registerSW[^"]*' app/dist/index.html; ls app/dist | head -40) > cap/dist.txt 2>&1 || true

      - name: Teste das notificações push (serviço real da Mozilla)
        continue-on-error: true
        run: |
          mkdir -p cap
          cat > push-e2e.mjs <<'EOF'
          import crypto from 'crypto';
          import fs from 'fs';
          const base = 'http://127.0.0.1:3000';
          const out = [];
          const log = (...a) => { out.push(a.join(' ')); console.log(...a); };
          try {
            const { chave } = await (await fetch(base + '/api/push/chave')).json();
            log('chave VAPID:', chave ? chave.slice(0, 12) + '…' : 'NENHUMA');
            const ws = new WebSocket('wss://push.services.mozilla.com/');
            const fila = [];
            let acordar = null;
            ws.onmessage = (e) => { fila.push(JSON.parse(e.data)); if (acordar) acordar(); };
            const proxima = (tipo, ms = 20000) => new Promise((res, rej) => {
              const t = setTimeout(() => rej(new Error('sem resposta: ' + tipo)), ms);
              const ver = () => { const i = fila.findIndex((m) => m.messageType === tipo); if (i >= 0) { clearTimeout(t); acordar = null; res(fila.splice(i, 1)[0]); } };
              acordar = ver; ver();
            });
            await new Promise((res, rej) => { ws.onopen = res; ws.onerror = rej; });
            ws.send(JSON.stringify({ messageType: 'hello', use_webpush: true, broadcasts: {} }));
            const hello = await proxima('hello');
            log('ligação ao serviço de push:', hello.status);
            const channelID = crypto.randomUUID();
            ws.send(JSON.stringify({ messageType: 'register', channelID, key: chave }));
            const reg = await proxima('register');
            log('registo:', reg.status, reg.pushEndpoint ? new URL(reg.pushEndpoint).host : '');
            const ua = crypto.createECDH('prime256v1'); ua.generateKeys();
            const auth = crypto.randomBytes(16);
            const subscricao = { endpoint: reg.pushEndpoint, keys: { p256dh: ua.getPublicKey().toString('base64url'), auth: auth.toString('base64url') } };
            let r = await fetch(base + '/api/push/subscrever', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ subscricao, distritos: ['Porto'] }) });
            log('subscrever:', r.status, await r.text());
            r = await fetch(base + '/api/push/teste', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ endpoint: reg.pushEndpoint }) });
            log('pedir teste:', r.status, await r.text());
            const n = await proxima('notification');
            ws.send(JSON.stringify({ messageType: 'ack', updates: [{ channelID: n.channelID, version: n.version }] }));
            const corpo = Buffer.from(n.data, 'base64url');
            const salt = corpo.subarray(0, 16);
            const idlen = corpo[20];
            const asPub = corpo.subarray(21, 21 + idlen);
            const cifrado = corpo.subarray(21 + idlen);
            const hmac = (k, d) => crypto.createHmac('sha256', k).update(d).digest();
            const prkKey = hmac(auth, ua.computeSecret(asPub));
            const ikm = hmac(prkKey, Buffer.concat([Buffer.from('WebPush: info\0', 'latin1'), ua.getPublicKey(), asPub, Buffer.from([1])]));
            const prk = hmac(salt, ikm);
            const cek = hmac(prk, Buffer.from('Content-Encoding: aes128gcm\0\x01', 'latin1')).subarray(0, 16);
            const nonce = hmac(prk, Buffer.from('Content-Encoding: nonce\0\x01', 'latin1')).subarray(0, 12);
            const d = crypto.createDecipheriv('aes-128-gcm', cek, nonce);
            d.setAuthTag(cifrado.subarray(cifrado.length - 16));
            const claro = Buffer.concat([d.update(cifrado.subarray(0, cifrado.length - 16)), d.final()]);
            log('NOTIFICAÇÃO RECEBIDA E DECIFRADA:', claro.subarray(0, claro.lastIndexOf(2)).toString('utf8'));
            r = await fetch(base + '/api/push/estado');
            log('estado:', (await r.text()).slice(0, 1500));
            ws.close();
          } catch (err) {
            log('FALHOU:', err?.message || err);
          }
          fs.writeFileSync('cap/push.txt', out.join('\n') + '\n');
          process.exit(0);
          EOF
          timeout 90 node push-e2e.mjs || true
          grep -i "push" app/app.log | tail -20 >> cap/push.txt || true

      - name: Tirar capturas
        run: |
          mkdir -p cap && cd cap && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > capturar.mjs <<'EOF'
          import { chromium } from 'playwright';
          const base = 'http://127.0.0.1:3000';
          const browser = await chromium.launch();
          const telemovel = { viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true, locale: 'pt-PT', timezoneId: 'Europe/Lisbon' };
          const registo = [];
          async function captura(nome, opcoes, caminho, acao, espera = 7000) {
            const ctx = await browser.newContext({ ...telemovel, ...opcoes });
            const page = await ctx.newPage();
            page.on('console', (m) => { if (m.type() === 'error') registo.push(`[${nome}] consola: ${m.text().slice(0, 200)}`); });
            page.on('pageerror', (e) => registo.push(`[${nome}] erro: ${String(e).slice(0, 300)}`));
            await page.goto(base + caminho, { waitUntil: 'load', timeout: 60000 }).catch((e) => registo.push(`[${nome}] goto: ${String(e).slice(0, 200)}`));
            await page.waitForTimeout(espera);
            if (acao) { try { await acao(page); } catch (e) { registo.push(`[${nome}] ação: ${String(e).slice(0, 200)}`); } await page.waitForTimeout(4000); }
            await page.screenshot({ path: `${nome}.png` });
            if (nome.includes('alertas') || nome.includes('privacidade')) await page.screenshot({ path: `${nome}-inteira.png`, fullPage: true });
            await ctx.close();
          }
          const porto = { geolocation: { latitude: 41.1462, longitude: -8.6110 }, permissions: ['geolocation'] };
          const spc = { geolocation: { latitude: 41.1435, longitude: -8.4947 }, permissions: ['geolocation'] };
          await captura('01-perto-sem-localizacao', {}, '/');
          await captura('02-perto-porto', porto, '/', null, 10000);
          await captura('03-perto-sao-pedro-da-cova', spc, '/', null, 10000);
          await captura('04-perto-paragem-aberta', porto, '/', async (p) => {
            const el = p.locator('[data-teste="paragem-perto"]:visible').first();
            if (await el.count()) await el.click(); else await p.locator('.custom-stop-marker-icon').first().click({ force: true });
          }, 10000);
          await captura('05-perto-localizacao-recusada', {}, '/', async (p) => {
            await p.locator('[data-teste="ativar-localizacao"]:visible').first().click();
          });
          await captura('05b-perto-bloqueada-ajuda', {}, '/', async (p) => {
            await p.locator('[data-teste="ativar-localizacao"]:visible').first().click();
            await p.waitForTimeout(3000);
            await p.locator('[data-teste="ativar-localizacao"]:visible').first().click();
          });
          // Localização autorizada mas sem posição (como com a localização do telemóvel desligada)
          await captura('05c-perto-localizacao-desligada', { permissions: ['geolocation'] }, '/', async (p) => {
            await p.evaluate(() => {
              const g = navigator.geolocation;
              const erro = (err) => setTimeout(() => err && err({ code: 2, message: 'desligada', PERMISSION_DENIED: 1, POSITION_UNAVAILABLE: 2, TIMEOUT: 3 }), 300);
              g.getCurrentPosition = (ok, err) => erro(err);
              g.watchPosition = (ok, err) => { erro(err); return 1; };
            });
            await p.locator('[data-teste="ativar-localizacao"]:visible').first().click().catch(() => {});
            await p.waitForTimeout(2500);
            await p.locator('[data-teste="ativar-localizacao"]:visible').first().click().catch(() => {});
          });
          await captura('06-alertas-porto', porto, '/alertas', null, 9000);
          await captura('07-alertas-sem-localizacao', {}, '/alertas', null, 9000);
          await captura('08-horarios-spc', spc, '/transportes', null, 10000);
          await captura('09-mapa', porto, '/mapa');
          // Auditoria: modais e páginas menos usadas
          await captura('20-entrar', {}, '/transportes', async (p) => { await p.locator('button:has-text("Entrar")').first().click(); }, 5000);
          await captura('21-notificacoes', {}, '/transportes', async (p) => { await p.locator('header button[aria-label*="otifica"], header button:has(svg.lucide-bell)').first().click(); }, 5000);
          await captura('22-ocorrencias', {}, '/ocorrencias', null, 6000);
          await captura('23-catalogo', {}, '/catalogo', null, 6000);
          await captura('24-cobertura', {}, '/cobertura', null, 8000);
          await captura('25-reportar', porto, '/mapa', async (p) => { await p.locator('button:has-text("Reportar")').first().click(); }, 6000);
          await captura('26-linha', porto, '/transportes', async (p) => { await p.locator('text=Linhas').first().scrollIntoViewIfNeeded(); await p.locator('h3:has-text("Linha Azul")').first().click(); }, 8000);
          await captura('27-404', {}, '/isto-nao-existe', null, 4000);
          // Botão "Instalar" no topo (Android e iPhone) com os passos abertos
          const uaAndroid = { userAgent: 'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Mobile Safari/537.36' };
          const uaIphone = { userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.6 Mobile/15E148 Safari/604.1' };
          await captura('28-instalar-android', { ...porto, ...uaAndroid }, '/', async (p) => { await p.locator('[data-teste="instalar-topo"]').click(); }, 8000);
          await captura('29-instalar-iphone', { ...porto, ...uaIphone }, '/', async (p) => { await p.locator('[data-teste="instalar-topo"]').click(); }, 8000);
          await captura('14-privacidade', {}, '/privacidade', null, 5000);
          await captura('15-sobre', {}, '/sobre', null, 5000);
          await captura('16-favoritos', {}, '/favoritos', null, 6000);
          // GPS lento (5 s) para ver se o Perto se lembra da posição ao trocar de separador e ao reabrir
          {
            const ctx = await browser.newContext({ ...telemovel, ...spc });
            await ctx.addInitScript(() => {
              const g = navigator.geolocation;
              const cp = g.getCurrentPosition.bind(g), wp = g.watchPosition.bind(g);
              g.getCurrentPosition = (ok, err, o) => cp((p) => setTimeout(() => ok(p), 5000), err, o);
              g.watchPosition = (ok, err, o) => wp((p) => setTimeout(() => ok(p), 5000), err, o);
            });
            const page = await ctx.newPage();
            page.on('pageerror', (e) => registo.push(`[10] erro: ${String(e).slice(0, 300)}`));
            const nav = (r) => page.locator(`nav[aria-label="Navegação inferior"] button[aria-label="${r}"]`);
            try {
              await page.goto(base + '/', { waitUntil: 'load', timeout: 60000 });
              await page.waitForTimeout(14000);
              await page.screenshot({ path: '10a-perto-antes.png' });
              await nav('Horários').click(); await page.waitForTimeout(3000);
              await nav('Perto').click(); await page.waitForTimeout(700);
              await page.screenshot({ path: '10b-perto-ao-voltar.png' });
              await page.reload({ waitUntil: 'load' }); await page.waitForTimeout(2500);
              await page.screenshot({ path: '10c-perto-ao-reabrir.png' });
            } catch (e) { registo.push(`[10] ${String(e).slice(0, 300)}`); }
            await ctx.close();
          }
          // Perto: a página não desliza (cabeçalho sempre à vista) e o "voltar" fecha a paragem
          {
            const ctx = await browser.newContext({ ...telemovel, ...porto });
            const page = await ctx.newPage();
            page.on('pageerror', (e) => registo.push(`[11] erro: ${String(e).slice(0, 300)}`));
            try {
              await page.goto(base + '/', { waitUntil: 'load', timeout: 60000 });
              await page.waitForTimeout(9000);
              const medir = () => page.evaluate(() => {
                const h = document.querySelector('header')?.getBoundingClientRect();
                return `scrollY=${Math.round(scrollY)} doc=${document.documentElement.scrollHeight} janela=${innerHeight} cabecalho_top=${h ? Math.round(h.top) : 'sem'}`;
              });
              registo.push(`[11] ao abrir: ${await medir()}`);
              await page.mouse.move(195, 700);
              await page.mouse.wheel(0, 600); await page.waitForTimeout(600);
              await page.evaluate(() => window.scrollTo(0, 400)); await page.waitForTimeout(400);
              registo.push(`[11] depois de deslizar: ${await medir()}`);
              await page.screenshot({ path: '11a-perto-depois-de-deslizar.png' });
              const el = page.locator('[data-teste="paragem-perto"]:visible').first();
              if (await el.count()) await el.click(); else await page.locator('.custom-stop-marker-icon').first().click({ force: true });
              await page.waitForTimeout(2500);
              await page.screenshot({ path: '11b-paragem-aberta.png' });
              await page.goBack(); await page.waitForTimeout(1500);
              registo.push(`[11] depois de voltar: url=${page.url()} painel=${await page.locator('.painel-paragem').count()}`);
              await page.screenshot({ path: '11c-depois-de-voltar.png' });
            } catch (e) { registo.push(`[11] ${String(e).slice(0, 300)}`); }
            await ctx.close();
          }
          // Favoritos: o browser apaga tudo e a app repõe a partir da cópia no servidor
          {
            const ctx = await browser.newContext({ ...telemovel });
            const page = await ctx.newPage();
            page.on('pageerror', (e) => registo.push(`[12] erro: ${String(e).slice(0, 300)}`));
            try {
              await page.goto(base + '/transportes', { waitUntil: 'load', timeout: 60000 });
              await page.waitForTimeout(4000);
              await page.evaluate(() => {
                localStorage.setItem('parou_favorite_line_ids', JSON.stringify(['stcp:801', 'metro_porto:D']));
                localStorage.setItem('parou_user_favorites', JSON.stringify([{ id: 'line-stcp:801', type: 'linha', category: 'transportes', title: '801 teste', lineCode: '801', addedAt: Date.now() }]));
              });
              await page.waitForTimeout(7000);
              await page.evaluate(() => localStorage.clear());
              await page.reload({ waitUntil: 'load' });
              await page.waitForTimeout(6000);
              const repostos = await page.evaluate(() => [localStorage.getItem('parou_favorite_line_ids'), localStorage.getItem('parou_user_favorites')]);
              registo.push(`[12] favoritos depois de apagar o browser: linhas=${repostos[0]} favoritos=${(repostos[1] || '').slice(0, 80)}`);
            } catch (e) { registo.push(`[12] ${String(e).slice(0, 300)}`); }
            await ctx.close();
          }
          // Alertas: separador Incêndios
          await captura('13-alertas-incendios', porto, '/alertas', async (p) => {
            await p.locator('button:has-text("Incêndios")').first().click();
          }, 9000);
          await browser.close();
          (await import('node:fs')).writeFileSync('registo.txt', registo.join('\n') || 'sem erros');
          EOF
          node capturar.mjs

      - name: Guardar
        if: always()
        run: |
          mkdir pub && cp cap/*.png cap/*.json cap/*.txt tipos.txt pub/ 2>/dev/null || true
          tail -n 60 app/app.log > pub/app.log 2>/dev/null || true
          cd pub && git init -q -b capturas
          git config user.name "parou-dados"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Capturas ${{ inputs.ref }} $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas
