name: Capturas de ecrã da app

# Compila a app (solobxy/parou), põe-na a correr com os dados reais e tira capturas
# em tamanho de telemóvel com o Chromium. Guarda as imagens no ramo "capturas".

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit ou ramo de solobxy/parou"
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: solobxy/parou
          ref: ${{ inputs.ref }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compilar a app
        working-directory: app
        run: |
          npm ci --no-audit --no-fund --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps
          npm run build

      - name: Arrancar a app
        working-directory: app
        run: |
          mkdir -p dados
          NODE_ENV=production PORT=3000 PAROU_DATA_DIR=$PWD/dados TZ=Europe/Lisbon nohup node --import tsx server.ts > app.log 2>&1 &
          for i in $(seq 1 60); do curl -s -m 5 http://127.0.0.1:3000/api/transit/loading-status | grep -q '"isLoading":false' && break; sleep 5; done
          curl -s http://127.0.0.1:3000/api/transit/loading-status

      - name: Tirar capturas
        run: |
          mkdir -p cap && cd cap && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > capturar.mjs <<'EOF'
          import { chromium } from 'playwright';
          const base = 'http://127.0.0.1:3000';
          const browser = await chromium.launch();
          const telemovel = { viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true, locale: 'pt-PT', timezoneId: 'Europe/Lisbon' };
          const registo = [];
          async function captura(nome, opcoes, caminho, acao) {
            const ctx = await browser.newContext({ ...telemovel, ...opcoes });
            const page = await ctx.newPage();
            page.on('console', (m) => { if (m.type() === 'error') registo.push(`[${nome}] consola: ${m.text().slice(0, 200)}`); });
            page.on('pageerror', (e) => registo.push(`[${nome}] erro: ${String(e).slice(0, 300)}`));
            await page.goto(base + caminho, { waitUntil: 'networkidle', timeout: 60000 }).catch((e) => registo.push(`[${nome}] goto: ${e}`));
            await page.waitForTimeout(6000);
            if (acao) { try { await acao(page); } catch (e) { registo.push(`[${nome}] ação: ${String(e).slice(0, 200)}`); } await page.waitForTimeout(4000); }
            await page.screenshot({ path: `${nome}.png` });
            await ctx.close();
          }
          const porto = { geolocation: { latitude: 41.1462, longitude: -8.6110 }, permissions: ['geolocation'] };
          const spc = { geolocation: { latitude: 41.1435, longitude: -8.4947 }, permissions: ['geolocation'] };
          await captura('01-perto-sem-localizacao', {}, '/');
          await captura('02-perto-porto', porto, '/');
          await captura('03-perto-sao-pedro-da-cova', spc, '/');
          await captura('04-perto-paragem-aberta', porto, '/', async (p) => {
            const el = p.locator('[data-teste="paragem-perto"]').first();
            if (await el.count()) await el.click(); else await p.locator('.custom-stop-marker-icon').first().click({ force: true });
          });
          await captura('05-alertas', porto, '/alertas');
          await captura('06-horarios', porto, '/transportes');
          await captura('07-mapa', porto, '/mapa');
          await browser.close();
          (await import('node:fs')).writeFileSync('registo.txt', registo.join('\n') || 'sem erros');
          EOF
          node capturar.mjs

      - name: Guardar
        if: always()
        run: |
          mkdir pub && cp cap/*.png cap/registo.txt pub/ 2>/dev/null || true
          tail -n 60 app/app.log > pub/app.log 2>/dev/null || true
          cd pub && git init -q -b capturas
          git config user.name "parou-dados"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Capturas ${{ inputs.ref }} $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas
