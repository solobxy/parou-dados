name: Manter a app acordada

# O servidor da app adormece quando fica uns minutos sem pedidos e, ao acordar,
# demora cerca de 2 minutos a descarregar a base de dados. Este pedido leve de
# 5 em 5 minutos mantém-no acordado. Nunca falha, para não gerar emails.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  acordar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pedir o estado da app
        run: |
          code=$(curl -s -o resposta.json -w "%{http_code}" --max-time 90 --retry 2 --retry-delay 10 "https://paroupt.ai.studio/api/transit/loading-status" || echo "000")
          echo "HTTP $code: $(head -c 200 resposta.json 2>/dev/null)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
