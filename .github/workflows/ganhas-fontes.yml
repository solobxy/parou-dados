name: ganhas.pt - descarregar fontes

# Descarrega as fontes públicas de salários (INE, Eurostat, DGAEP, IRS) com ganhas/fontes/descarregar.py
# e guarda tudo, em bruto, no ramo "ganhas-fontes-brutas". Corre quando há push no ramo ganhas-recolha,
# à mão, e uma vez por mês (os dados oficiais mudam pouco).

on:
  push:
    branches: [ganhas-recolha]
    paths: ["ganhas/fontes/**", ".github/workflows/ganhas-fontes.yml"]
  workflow_dispatch:
  schedule:
    - cron: "40 4 3 * *"

permissions:
  contents: write

concurrency:
  group: ganhas-fontes
  cancel-in-progress: true

jobs:
  descarregar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Descarregar
        run: |
          pip install --quiet pdfplumber
          python3 ganhas/fontes/descarregar.py saida 2>&1 | tee saida-log.txt
          du -sh saida; ls -la saida saida/docs | head -40
      - name: Guardar no ramo ganhas-fontes-brutas
        if: always()
        run: |
          set -e
          mkdir -p saida && cp saida-log.txt saida/ 2>/dev/null || true
          cd saida && git init -q -b ganhas-fontes-brutas
          git config user.name "parou-dados"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Fontes $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ganhas-fontes-brutas
