name: Caminhos a pé (desenho dos troços a pé)

# Rede de caminhos a pé de Portugal (ruas, passeios, escadas, praças) do OpenStreetMap (Geofabrik), em mosaicos, para a
# PAROU desenhar os troços a pé das viagens pelas ruas em vez de em linha reta. Vai para a release "caminhos"
# (caminhos.sqlite.gz). O gerador diário dos dados (main.yml) junta-a à base (tabela ape).
# As ruas mudam pouco: basta uma vez por semana (domingo), ou à mão depois de mudar caminhos_a_pe.py.

on:
  schedule:
    - cron: "40 2 * * 0"
  workflow_dispatch:
    inputs:
      publicar:
        description: "1 = publicar na release caminhos (0 = só o relatório)"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  caminhos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ferramentas
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          osmium --version | head -1

      - name: Mapa de Portugal (Geofabrik)
        run: |
          curl -fL --retry 3 --retry-delay 10 -o portugal.osm.pbf https://download.geofabrik.de/europe/portugal-latest.osm.pbf
          ls -l portugal.osm.pbf

      - name: Só as vias
        run: |
          osmium tags-filter portugal.osm.pbf w/highway -o vias.osm.pbf --overwrite
          ls -l vias.osm.pbf
          osmium export vias.osm.pbf -f geojsonseq -x print_record_separator=false \
            --geometry-types=linestring,polygon -o vias.geojsonseq --overwrite
          ls -l vias.geojsonseq

      - name: Mosaicos
        run: |
          python caminhos_a_pe.py vias.geojsonseq caminhos.sqlite | tee relatorio-caminhos.txt
          ls -l caminhos.sqlite
          gzip -9 -k caminhos.sqlite
          ls -l caminhos.sqlite.gz | tee -a relatorio-caminhos.txt

      - name: Publicar na release "caminhos"
        if: ${{ (inputs.publicar || '1') == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view caminhos >/dev/null 2>&1 || gh release create caminhos --title "Caminhos a pé" --notes "Rede de caminhos a pé de Portugal (OpenStreetMap, ODbL) em mosaicos, para desenhar os troços a pé pelas ruas. Atualizado todos os domingos."
          gh release upload caminhos caminhos.sqlite.gz --clobber

      - name: Relatório no ramo caminhos-resultado
        if: always()
        run: |
          mkdir -p /tmp/r && cp relatorio-caminhos.txt /tmp/r/ 2>/dev/null || echo "sem relatório" > /tmp/r/relatorio-caminhos.txt
          cd /tmp/r && git init -q -b caminhos-resultado && git config user.name "parou-dados" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Caminhos $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" caminhos-resultado
