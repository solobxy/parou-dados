name: Verificar servidor (só leitura)

# Corre no servidor, por SSH, só comandos de leitura para confirmar serviços novos. Resultado no ramo
# "verificar-servidor-resultado". Corre sozinho a cada push para o ramo verificar-servidor.

on:
  push:
    branches: [verificar-servidor]

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Ler o estado
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          (umask 077; openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:HCLOUD_TOKEN -in servidor/chave-ssh.enc -out ~/.ssh/id_ed25519)
          printf 'Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n  LogLevel ERROR\n  ConnectTimeout 15\n' > ~/.ssh/config
          IP=$(curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" "https://api.hetzner.cloud/v1/servers?name=parou" | jq -r '.servers[0].public_net.ipv4.ip')
          ssh root@$IP 'bash -s' < .github/verificar.sh > resultado.txt 2>&1 || echo "ssh terminou com erro $?" >> resultado.txt
          sed -i -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/<ip>/g' resultado.txt
      - name: Guardar
        if: always()
        run: |
          mkdir -p pub && cp resultado.txt pub/ 2>/dev/null || echo "sem resultado" > pub/resultado.txt
          cd pub && git init -q -b verificar-servidor-resultado
          git config user.name "parou-dados"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "verificação $(date -u +%H:%MZ)" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" verificar-servidor-resultado
