name: Teste do carrossel de boas-vindas

# Compila a app (solobxy/parou), põe-na a correr e testa/fotografa o carrossel de boas-vindas (3 temas, vários tamanhos,
# idiomas, primeira visita, utilizador antigo, robôs e botão do administrador). Resultado no ramo "bemvindo-resultado".

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit ou ramo de solobxy/parou"
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  bemvindo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: solobxy/parou
          ref: ${{ inputs.ref }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compilar a app
        working-directory: app
        run: |
          npm ci --no-audit --no-fund --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps
          npm run build
          npx tsc --noEmit -p . > ../tipos.txt 2>&1 || true
          echo "linhas de erro de tipos: $(wc -l < ../tipos.txt)"

      - name: Arrancar a app
        working-directory: app
        run: |
          mkdir -p dados
          NODE_ENV=production PORT=3000 PAROU_DATA_DIR=$PWD/dados TZ=Europe/Lisbon FOGOS_TESTE=1 nohup node --import tsx server.ts > app.log 2>&1 &
          for i in $(seq 1 60); do curl -s -m 5 http://127.0.0.1:3000/api/transit/loading-status | grep -q '"isLoading":false' && break; sleep 5; done
          sleep 5

      - name: Instalar Playwright
        run: |
          cd auditoria && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null

      - name: Testar e fotografar
        continue-on-error: true
        working-directory: auditoria
        run: |
          mkdir -p ../res
          SAIDA=../res timeout 1200 node bemvindo.mjs 2>&1 | tee ../res/consola.txt | tail -150

      - name: Guardar
        if: always()
        run: |
          cp tipos.txt res/ 2>/dev/null || true
          mkdir -p pub && cp -r res/* pub/ 2>/dev/null || echo "sem resultados" > pub/vazio.txt
          cd pub && git init -q -b bemvindo-resultado
          git config user.name "parou-dados"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Boas-vindas ${{ inputs.ref }} $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" bemvindo-resultado
