name: Planeador — teste de optimalidade

# Todos os dias, com os horários do dia e a app de main: um algoritmo de referência, escrito à parte (auditoria/planeador-otimo.mjs),
# calcula o melhor percurso possível com as mesmas regras do planeador e compara com o que o planeador dá, em 240 viagens
# (Lisboa, Porto, Coimbra, Braga, Funchal e Faro, às 08:00 e às 17:30 de um dia útil).
# Falha (e o GitHub manda um email) se o planeador der o melhor percurso em menos de 97% das viagens.
# Resultado (resumo e cada falha com o percurso que a referência encontrou) no ramo "planeador-otimo-resultado".

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit ou ramo de solobxy/parou"
        required: false
        default: "main"
      n:
        description: "Viagens por região e hora"
        required: false
        default: "20"

permissions:
  contents: write

jobs:
  otimo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: solobxy/parou
          ref: ${{ inputs.ref || 'main' }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar e arrancar a app
        working-directory: app
        run: |
          npm ci --no-audit --no-fund --legacy-peer-deps >/dev/null 2>&1 || npm install --no-audit --no-fund --legacy-peer-deps >/dev/null 2>&1
          mkdir -p dados
          NODE_ENV=production PORT=3000 PAROU_DATA_DIR=$PWD/dados TZ=Europe/Lisbon nohup node --import tsx server.ts > app.log 2>&1 &
          for i in $(seq 1 90); do curl -s -m 5 http://127.0.0.1:3000/api/transit/loading-status | grep -q '"isLoading":false' && break; sleep 5; done
          # o índice do planeador demora uns segundos a ficar pronto
          curl -s -m 120 "http://127.0.0.1:3000/api/transit/plan-route?originLat=38.7369&originLon=-9.1546&destLat=38.7046&destLon=-9.1772" > /dev/null || true
          # cópia da base para a referência (lê-a sem mexer na da app)
          mkdir -p ../ref && cp dados/gtfs.db ../ref/gtfs.db

      - name: Teste de optimalidade
        working-directory: app
        run: |
          mkdir -p ../res
          N="${{ inputs.n || '20' }}"
          DB=$GITHUB_WORKSPACE/ref/gtfs.db APP=$PWD BASE=http://127.0.0.1:3000 N=$N SAIDA=../res node --import tsx ../auditoria/planeador-otimo.mjs 2>&1 | grep -v "Experimental\|trace-warnings\|SQL lento" | tee ../res/consola.txt | tail -80
          node -e "const r=require('../res/planeador-otimo.json');const p=r.total?100*(r.total-r.falhas)/r.total:0;console.log('acerto',p.toFixed(1)+'%');if(r.total<50||p<97)process.exit(1)"

      - name: Guardar
        if: always()
        run: |
          tail -60 app/app.log > res/servidor.txt 2>/dev/null || true
          mkdir -p pub && cp -r res/* pub/ 2>/dev/null || echo "sem resultados" > pub/vazio.txt
          cd pub && git init -q -b planeador-otimo-resultado
          git config user.name "parou-dados"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Planeador ótimo ${{ inputs.ref || 'main' }} $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" planeador-otimo-resultado
