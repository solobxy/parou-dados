name: CI ilhas (capturas da app nova)
on:
  push:
    branches: [ci-ilhas-capturas]
permissions:
  contents: write
jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: solobxy/parou
          ref: 22b2cba0e041f8bc5c88c3cf1611037ab9508436
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compilar
        working-directory: app
        run: |
          npm ci --no-audit --no-fund --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps
          npm run build 2>&1 | tail -5
      - name: Arrancar a app
        working-directory: app
        run: |
          mkdir -p dados
          NODE_ENV=production PORT=3000 PAROU_DATA_DIR=$PWD/dados TZ=Europe/Lisbon nohup node --import tsx server.ts > app.log 2>&1 &
          for i in $(seq 1 72); do curl -s -m 5 http://127.0.0.1:3000/api/transit/loading-status | grep -q '"isLoading":false' && break; sleep 5; done
          sleep 5
      - name: API
        run: |
          mkdir -p .github/ilhas-ci/res
          cd .github/ilhas-ci/res
          for s in "santana 32.805 -16.882" "funchal 32.6478 -16.9105" "porto-santo 33.06 -16.34" "ponta-delgada 37.74 -25.668"; do set -- $s; curl -s -m 60 "http://127.0.0.1:3000/api/alertas?lat=$2&lon=$3" -o "alertas-$1.json"; done
          curl -s -m 60 "http://127.0.0.1:3000/api/alertas?area=AOR" -o alertas-area-AOR.json
          curl -s -m 60 "http://127.0.0.1:3000/api/alertas?area=MCN" -o alertas-area-MCN.json
          curl -s -m 60 "http://127.0.0.1:3000/api/mapa" -o mapa.json
          curl -s -m 60 "http://127.0.0.1:3000/paragens/horarios-do-funchal" -o paragens-funchal.html
          curl -s -m 60 "http://127.0.0.1:3000/linhas/horarios-do-funchal" -o linhas-funchal.html
          curl -s -m 60 "http://127.0.0.1:3000/linhas/horarios-do-funchal/027-centro-cam-ferro" -o linha-027.html -w "linha 027 %{http_code}\n" | tee -a codigos.txt
          curl -s -m 60 "http://127.0.0.1:3000/paragens/horarios-do-funchal/cam-trapiche-d2a-750b" -o paragem-750b.html -w "paragem 750B %{http_code}\n" | tee -a codigos.txt
          for id in 2311000 2310900 2310300; do curl -s -m 20 "https://api.ipma.pt/open-data/forecast/meteorology/cities/daily/$id.json" | head -c 400 > ipma-$id.txt; done
      - name: Capturas
        continue-on-error: true
        run: |
          cd .github/ilhas-ci && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node capturar.mjs
      - name: Guardar
        if: always()
        run: |
          tail -60 app/app.log > .github/ilhas-ci/res/servidor.txt 2>/dev/null || true
          mkdir -p pub && cp -r .github/ilhas-ci/res/* pub/ 2>/dev/null || echo vazio > pub/vazio.txt
          cd pub && git init -q -b ci-ilhas-capturas-resultado
          git config user.name "parou-dados"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "capturas $(date -u +%H:%MZ)" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-ilhas-capturas-resultado
