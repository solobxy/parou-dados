name: Dados PAROU.PT

on:
  schedule:
    - cron: "30 3 * * *"
    # Segunda volta à tarde: se a da manhã falhar ou atrasar, os horários não ficam velhos
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # STCP: credenciais da API oficial, cifradas no repositório (servidor/stcp.age). Só se abrem com o
      # HCLOUD_TOKEN; ficam mascaradas nos registos e só existem durante esta execução.
      - name: Credenciais da STCP
        continue-on-error: true
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          if [ -n "$HCLOUD_TOKEN" ] && [ -f servidor/stcp.age ] && [ -f servidor/chave-ssh.enc ]; then
            command -v age >/dev/null 2>&1 || sudo apt-get install -y -qq age >/dev/null 2>&1 || true
            (umask 077; openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:HCLOUD_TOKEN -in servidor/chave-ssh.enc -out "$RUNNER_TEMP/chave" 2>/dev/null) || true
            DADOS=$(age -d -i "$RUNNER_TEMP/chave" servidor/stcp.age 2>/dev/null) || DADOS=""
            rm -f "$RUNNER_TEMP/chave"
            ID=$(printf '%s' "$DADOS" | sed -n 1p)
            CHAVE=$(printf '%s' "$DADOS" | sed -n 2p)
            if [ -n "$ID" ] && [ -n "$CHAVE" ]; then
              echo "::add-mask::$ID"
              echo "::add-mask::$CHAVE"
              { echo "STCP_APP_ID=$ID"; echo "STCP_API_KEY=$CHAVE"; } >> "$GITHUB_ENV"
              echo "Credenciais da STCP prontas"
            else
              echo "Sem credenciais da STCP: a usar as fontes abertas"
            fi
          else
            echo "Sem credenciais da STCP: a usar as fontes abertas"
          fi

      - name: Construir a base de dados
        run: python construir_dados.py

      - name: Publicar na release "dados"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dados >/dev/null 2>&1 || gh release create dados --title "Dados PAROU.PT" --notes "Base de dados de horários, atualizada todos os dias."
          gh release upload dados gtfs.db.gz manifest.json --clobber

      - name: Guardar o resumo no repositório
        run: |
          git config user.name "parou-dados"
          git config user.email "actions@users.noreply.github.com"
          git add manifest.json
          git commit -m "Dados de $(date -u +%Y-%m-%d)" || echo "Sem alterações"
          # Outro envio pode ter chegado entretanto: junta e tenta outra vez
          for i in 1 2 3 4 5; do
            git push && break
            git pull --rebase -q origin main || true
            sleep $((i * 5))
          done

      - name: Avisar feeds com problemas
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python avisos.py
