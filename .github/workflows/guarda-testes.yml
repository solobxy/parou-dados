name: Guarda dos testes rápidos

# Todos os dias, e sempre que se pede à mão, corre os testes rápidos (sem browser) sobre a versão que está em "main" da app:
#   - tipos (tsc), sem nenhum erro;
#   - detetor do «A bordo»;
#   - leitura da TUB (ficheiros montados à mão e, se responderem, os reais);
#   - planeador: metro, comboio e barco têm de aparecer nas opções de viagem (base GTFS montada, motor a sério);
#   - movimento dos autocarros no mapa: suave, sem «teleportes», com séries reais medidas no servidor.
# A app (solobxy/parou) não corre testes a cada alteração; esta guarda apanha, no máximo no dia seguinte, uma alteração
# que estrague uma destas coisas. Só falha (e o GitHub manda um email) se algum teste falhar.
# Os testes com browser (rodas no mapa, painel «A bordo», temas…) ficam no workflow «a-bordo», que se corre à mão.

on:
  schedule:
    - cron: "11 7 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Ramo, etiqueta ou commit da app (vazio = main)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  guarda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: solobxy/parou
          ref: ${{ inputs.ref || 'main' }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Construtor da base (desenhos dos percursos)
        run: |
          python3 auditoria/test_formas.py
          python3 auditoria/test_calendario_ponte.py
          python3 auditoria/test_caminhos_a_pe.py
          python3 auditoria/test_metro_mondego.py
          python3 auditoria/test_siga_agencias.py
          python3 auditoria/test_desenhos_autocarros.py
          python3 caiu/verificar/test_paginas.py

      - name: caiu.pt luz e gás (contas iguais às da ERSE, Galp COMBINA, parcerias, página)
        run: python3 caiu/verificar/test_energia.py

      - name: Pagamentos da DupliCasa (ifthenpay simulada)
        run: python3 duaschaves/testes/testar_pagamentos.py

      - name: Páginas de piercings do Adri em dia com os preços do site
        run: |
          python3 adri/paginas.py
          git diff --exit-code -- sites/adribodypiercing/piercing sites/adribodypiercing/sitemap.xml || { echo "Corre python3 adri/paginas.py e publica as páginas"; exit 1; }

      - name: Agenda e painel do Adri (marcações, preços, horário, fotos, avaliações)
        run: python3 adri/test_agenda.py

      - name: Pedidos e painel da Dayla (dias, estúdios, preços, pedidos PT/EN, fotos, avaliações)
        run: python3 dayla/test_agenda.py

      - name: Instalar e verificar os tipos
        working-directory: app
        run: |
          npm ci --no-audit --no-fund --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps
          echo "Versão da app: $(git rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          npx tsc --noEmit -p . > ../tipos.txt 2>&1 || true
          n=$(wc -l < ../tipos.txt)
          echo "Linhas de erro de tipos: $n" | tee -a "$GITHUB_STEP_SUMMARY"
          head -40 ../tipos.txt
          [ "$n" -eq 0 ]

      - name: Detetor do «A bordo»
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/a-bordo-detetor.mjs 2>&1 | tail -40; exit ${PIPESTATUS[0]}

      - name: Leitura da TUB
        working-directory: app
        run: |
          mkdir -p ../tub-real
          curl -s -m 30 -o ../tub-real/vehicle_positions.pb https://mobibus-gateway.fleetaware.pt/gtfs-rt/feed/vehicle_positions.pb || true
          curl -s -m 30 -o ../tub-real/trip_updates.pb https://mobibus-gateway.fleetaware.pt/gtfs-rt/feed/trip_updates.pb || true
          REAIS=""
          if [ -s ../tub-real/vehicle_positions.pb ] && [ -s ../tub-real/trip_updates.pb ]; then REAIS="$(cd ../tub-real && pwd)"; fi
          FICHEIROS_TUB="$REAIS" APP=$PWD node --import tsx ../auditoria/tub-leitor.mjs 2>&1 | tail -40; exit ${PIPESTATUS[0]}

      - name: Planeador (tempo real no cálculo dos percursos)
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/planeador-tempo-real.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -40; exit ${PIPESTATUS[0]}

      - name: Planeador (UNIR com horários nos percursos normais)
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/planeador-unir.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -40; exit ${PIPESTATUS[0]}

      - name: Avisos da TML (plataforma GO, endereços com a organização)
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/tml-alertas.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -30; exit ${PIPESTATUS[0]}

      - name: Planeador (o castigo de andar a pé não faz perder autocarros)
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/planeador-castigo-a-pe.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -20; exit ${PIPESTATUS[0]}

      - name: Planeador (metro, comboio e barco nas opções de viagem)
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/planeador-modos.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -50; exit ${PIPESTATUS[0]}

      - name: Planeador (só metro quando é o que se escolhe; melhor opção em primeiro)
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/planeador-preferencias.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -40; exit ${PIPESTATUS[0]}

      - name: Planeador (minutos e metros a pé pelas ruas)
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/planeador-a-pe-ruas.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -40; exit ${PIPESTATUS[0]}

      - name: Convite para instalar (regras) e contagem de quem abre a app instalada
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/convite-instalar.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -30; exit ${PIPESTATUS[0]}

      - name: Pesquisa (código postal com hífen dá o código exato primeiro)
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/pesquisa-locais.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -30; exit ${PIPESTATUS[0]}

      - name: Greves (avisos da CP, plenários à parte, datas sem «amanhã» no HTML, descrições inteiras)
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/greves-avisos.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -50; exit ${PIPESTATUS[0]}

      - name: Fonte da Transtejo Soflusa, cidades à volta do Tejo e do Douro, desenhos oficiais estragados
        working-directory: app
        run: |
          APP=$PWD node --import tsx ../auditoria/ttsl-fonte.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -20; a=${PIPESTATUS[0]}
          APP=$PWD node --import tsx ../auditoria/cidades-margens.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -20; b=${PIPESTATUS[0]}
          APP=$PWD node --import tsx ../auditoria/desenho-alternativo.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -20; c=${PIPESTATUS[0]}
          APP=$PWD node --import tsx ../auditoria/encaixe-desenho.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -20; d=${PIPESTATUS[0]}
          exit $(( a || b || c || d ))

      - name: Memória (linhas perto de um ponto com limite; raio entre 100 e 2000 m)
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/cache-linhas-perto.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -20; exit ${PIPESTATUS[0]}

      - name: Travão à cópia automática das páginas (robô travado; pessoas, Google e testes nunca)
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/travao-raspagem.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -40; exit ${PIPESTATUS[0]}

      - name: Movimento dos autocarros (suave, sem teleportes)
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/trajeto-veiculo.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -90; exit ${PIPESTATUS[0]}

      - name: Bola do autocarro «meu» só segue a pessoa quando ela está perto dele
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/seguir-pessoa.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -40; exit ${PIPESTATUS[0]}

      - name: Zoom do mapa a seguir o autocarro «a bordo»
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/seguir-mapa.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -40; exit ${PIPESTATUS[0]}

      - name: Nomes dos distritos (Bragança não é Braga)
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/distritos.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -50; exit ${PIPESTATUS[0]}

      - name: Autocarros no ecrã (todos os da zona que se vê)
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/veiculos-no-ecra.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -60; exit ${PIPESTATUS[0]}

      - name: Nomes das paragens (abreviaturas do Funchal, siglas, numeração romana; endereços que não mudam)
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/nomes-paragens.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -60; exit ${PIPESTATUS[0]}

      - name: Madeira e Açores (aviso onde não há horários, zonas de aviso do IPMA nas ilhas)
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/ilhas.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -40; exit ${PIPESTATUS[0]}

      - name: Fuso dos operadores dos Açores (pela posição das paragens)
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/fuso-ilhas.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -20; exit ${PIPESTATUS[0]}

      - name: Horários dos próximos dias numa linha (dia útil, sábado, previsto, última paragem)
        working-directory: app
        run: APP=$PWD node --import tsx ../auditoria/horario-dia.mjs 2>&1 | grep -v "Experimental\|trace-warnings" | tail -30; exit ${PIPESTATUS[0]}
