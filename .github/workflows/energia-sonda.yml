name: Energia - sonda da ERSE e das campanhas

# Corre a cada push para o ramo energia-sonda. Guarda o que encontrar no ramo energia-sonda-resultado.

on:
  push:
    branches: [energia-sonda]

permissions:
  contents: write

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sondar
        run: python3 energia-sonda/oraculo2.py 2>&1 | tee registo.txt
      - name: Guardar
        if: always()
        run: |
          mkdir pub && cp -r saida pub/ 2>/dev/null; cp registo.txt pub/ 2>/dev/null; ls -la pub/saida | head -80
          cd pub && git init -q -b energia-sonda-resultado
          git config user.name "parou-dados"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Sonda $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" energia-sonda-resultado
