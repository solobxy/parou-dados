<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Dayla</title>
<meta name="theme-color" content="#101010">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
@font-face{font-family:Archivo;src:url(/fonts/archivo.woff2) format("woff2-variations"),url(/fonts/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
:root{--papel:#F5F5F3;--papel-2:#E8E8E4;--branco:#FFF;--tinta:#101010;--tinta-2:#1C1C1C;--rosa:#F7B8D2;--rosa-tinta:#B02A66;--sec:#545454;--verde:#1F6B3A;--sai:cubic-bezier(.2,.8,.2,1)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;touch-action:manipulation;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--tinta);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;font-weight:820;font-stretch:72%;letter-spacing:-.015em;line-height:1}
h1{font-size:40px}h2{font-size:30px}h3{font-size:22px}
p{margin:0}
.env{max-width:760px;margin:0 auto;padding:0 16px}
.topo{position:sticky;top:0;z-index:20;background:var(--papel);border-bottom:2px solid var(--tinta)}
.topo .env{display:flex;align-items:center;gap:12px;height:60px}
.topo strong{font-weight:860;font-stretch:118%;font-size:22px;letter-spacing:-.02em}
.topo span{color:var(--sec);margin-right:auto}
.topo a{font-weight:600;font-size:15px}
main{padding:24px 0 40px}
.vista>h1{margin-bottom:6px}
.sub{color:var(--sec)}
.bloco{margin-top:32px}
.bloco>h2{margin-bottom:12px;display:flex;align-items:center;gap:10px}
.bloco>h2 .n{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;background:var(--rosa);border:2px solid var(--tinta);border-radius:999px;font-size:16px;font-stretch:100%;font-weight:800}
.vazio{padding:20px;background:var(--papel-2);border-radius:6px;color:var(--sec)}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;border:2px solid var(--tinta);background:var(--branco);color:var(--tinta);font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .1s,background-color .15s}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--rosa)}
.btn.esc{background:var(--tinta);color:var(--papel)}
.btn.verm{background:var(--branco)}
.btn.verm{color:var(--rosa-tinta);border-color:var(--rosa-tinta)}
.btn.peq{min-height:40px;padding:0 14px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:20px;height:20px}
.acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.lnk{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:600}
/* lista de pedidos */
.lista{list-style:none;margin:0;padding:0;border-top:2px solid var(--tinta)}
.lista>li{border-bottom:2px solid rgba(16,16,16,.15)}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;padding:14px 4px;background:none;border:0;text-align:left;cursor:pointer}
.item:hover{background:rgba(16,16,16,.04)}
.item .q{min-width:58px;text-align:center;font-weight:820;font-stretch:72%;font-size:26px;line-height:1}
.item .q small{display:block;font-size:12px;font-weight:700;font-stretch:100%;color:var(--sec);text-transform:lowercase}
.item .q.sem{font-size:15px;font-stretch:100%;font-weight:700;color:var(--rosa-tinta)}
.item .t{min-width:0}
.item .t b{display:block;font-size:17px}
.item .t>span{display:block;color:var(--sec);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .d{font-weight:800;font-stretch:112%;font-variant-numeric:tabular-nums;text-align:right}
.item .d small{display:block;font-weight:600;font-stretch:100%;font-size:12px;color:var(--sec)}
.etq{display:inline-block;font-size:12px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--tinta);color:var(--papel);margin-left:6px;vertical-align:2px}
.etq.rosa{background:var(--rosa);color:var(--tinta)}
.dia-cab{padding:16px 4px 6px;font-weight:800;font-size:15px;color:var(--sec)}
details.hist{margin-top:28px}
details.hist summary{cursor:pointer;font-weight:700;padding:10px 0}
/* separadores em baixo */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tinta);color:var(--papel);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:760px}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;background:none;border:0;color:#B5B5B5;cursor:pointer;font-weight:700;font-size:13px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-selected="true"]{color:var(--papel)}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:50%;width:22px;height:5px;margin-left:-11px;background:var(--rosa)}
.tabs .bol{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--rosa);color:var(--tinta);font-size:11px;font-weight:800;line-height:18px}
/* folhas (janelas) */
dialog{border:0;padding:0;width:100%;max-width:640px;max-height:92dvh;border-radius:12px 12px 0 0;margin:auto auto 0;background:var(--papel);color:var(--tinta)}
@media (min-width:700px){dialog{border-radius:12px;margin:auto}}
dialog::backdrop{background:rgba(16,16,16,.55)}
dialog[open]{animation:sobe .28s var(--sai)}
@keyframes sobe{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:aparece .15s}}
@keyframes aparece{from{opacity:0}to{opacity:1}}
.fcab{position:sticky;top:0;background:var(--papel);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 12px;border-bottom:2px solid var(--tinta);z-index:2}
.fcorpo{padding:16px 16px 28px}
.fechar{width:44px;height:44px;border-radius:999px;border:2px solid var(--tinta);background:none;display:grid;place-items:center;cursor:pointer;flex:none}
.fechar svg{width:16px;height:16px}
.dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:0}
.dl dt{color:var(--sec);font-size:14px;padding-top:2px}
.dl dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.secao{margin-top:22px;padding-top:18px;border-top:2px solid rgba(16,16,16,.15)}
.secao h3{margin-bottom:10px}
/* formulários */
.campo{margin-bottom:16px}
.campo label,.rot{display:block;font-weight:700;margin-bottom:6px;font-size:15px}
.campo input,.campo select,.campo textarea{width:100%;min-height:48px;padding:10px 12px;border:2px solid var(--tinta);border-radius:6px;background:var(--branco);font-size:16px}
.campo textarea{min-height:96px;resize:vertical}
.grelha{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.ajuda{font-size:14px;color:var(--sec);margin-top:4px}
.erro{color:var(--rosa-tinta);font-weight:700;font-size:15px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button,.chips label{display:inline-flex;align-items:center;min-height:42px;padding:0 14px;border:2px solid var(--tinta);border-radius:999px;background:var(--branco);font-weight:650;cursor:pointer;font-variant-numeric:tabular-nums}
.chips [aria-pressed="true"],.chips input:checked+span{background:var(--tinta);color:var(--papel)}
.chips label{padding:0}.chips label span{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:999px}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips .ocupada{opacity:.35;text-decoration:line-through;cursor:not-allowed}
/* preços */
.servs{list-style:none;margin:0;padding:0}
.serv{display:grid;grid-template-columns:1fr 92px;gap:8px 10px;align-items:center;padding:12px 0;border-bottom:2px solid rgba(16,16,16,.12)}
.serv .nm{font-weight:700;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.serv .nm small{display:block;font-weight:400;color:var(--sec);font-size:13px}
.serv .nm.oculto{opacity:.45;text-decoration:line-through}
.serv .pr{position:relative}
.serv .pr input{width:100%;min-height:46px;padding:8px 26px 8px 10px;border:2px solid var(--tinta);border-radius:6px;background:var(--branco);font-weight:800;font-size:17px;text-align:right;font-variant-numeric:tabular-nums}
.serv .pr span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-weight:700;pointer-events:none}
.serv .pr input:placeholder-shown{font-weight:400}
.cat-t{margin:22px 0 4px;font-size:15px;font-weight:800;color:var(--sec)}
.barra-g{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));margin-top:16px;padding:12px;background:var(--tinta);color:var(--papel);border-radius:999px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.barra-g p{padding-left:10px;font-weight:700;font-size:15px}
.barra-g .btn{border-color:var(--rosa)}
/* site: separadores pequenos */
.seg{display:flex;gap:8px;overflow-x:auto;margin:16px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.seg button{flex:none;min-height:42px;padding:0 16px;border:2px solid var(--tinta);border-radius:999px;background:var(--branco);font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--tinta);color:var(--papel)}
/* fotos */
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fotos figure{margin:0;position:relative;aspect-ratio:4/5;background:var(--papel-2);overflow:hidden;border-radius:4px}
.fotos img{width:100%;height:100%;object-fit:cover}
.fotos button{position:absolute;inset:0;background:none;border:0;cursor:pointer}
.perfil{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.perfil figure{margin:0;aspect-ratio:4/5;background:var(--papel-2);border:2px solid var(--tinta);overflow:hidden;border-radius:4px}
.perfil img{width:100%;height:100%;object-fit:cover}
.carrega{display:inline-flex}
/* números */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:600px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--branco);border:2px solid var(--tinta);border-radius:6px;padding:14px}
.kpi b{display:block;font-weight:820;font-stretch:112%;font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{color:var(--sec);font-size:14px}
.kpi.rosa{background:var(--rosa)}
.kpi.rosa span{color:var(--tinta)}
.grafico{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:12px;border-bottom:2px solid var(--tinta)}
.grafico i{flex:1;background:var(--tinta);min-height:2px;border-radius:2px 2px 0 0}
.grafico i.zero{background:var(--papel-2)}
.eixo{display:flex;justify-content:space-between;color:var(--sec);font-size:13px;margin-top:4px}
.barras-h div{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:8px 0;border-bottom:2px solid rgba(16,16,16,.1)}
.barras-h b{font-variant-numeric:tabular-nums}
.barras-h i{grid-column:1/-1;height:6px;width:var(--w);background:var(--rosa);border:1.5px solid var(--tinta);border-radius:3px}
/* entrada */
.entrar{min-height:100dvh;display:grid;place-items:center;padding:24px}
.entrar form{width:100%;max-width:360px}
.entrar h1{font-size:48px;margin-bottom:8px}
.aviso{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--tinta);color:var(--papel);padding:12px 18px;border-radius:999px;font-weight:700;z-index:50;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.aviso.ve{opacity:1;transform:translateX(-50%)}
.mais-btn{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;width:58px;height:58px;border-radius:999px;border:2px solid var(--tinta);background:var(--rosa);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 0 var(--tinta)}
.mais-btn svg{width:24px;height:24px}
.mais-btn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--tinta)}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app"></div>
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>
<dialog id="folha" aria-labelledby="f-titulo"><div class="fcab"><h2 id="f-titulo"></h2><button class="fechar" type="button" data-fechar aria-label="Fechar"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2.2" fill="none"/></svg></button></div><div class="fcorpo" id="f-corpo"></div></dialog>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var euro=new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
var fDia=new Intl.DateTimeFormat('pt-PT',{weekday:'short',day:'numeric',month:'short'});
var fLongo=new Intl.DateTimeFormat('pt-PT',{weekday:'long',day:'numeric',month:'long'});
var fLongoEn=new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long'});
var CATS=[['orelha','Orelha'],['rosto','Rosto'],['corpo','Corpo'],['servicos','Serviços']];
var SEMANA=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'], PER={manha:'manhã',tarde:'tarde',noite:'fim do dia'};
var ESTADO={pendente:'Por responder',confirmada:'Confirmada',recusada:'Recusada',cancelada:'Cancelada',concluida:'Feita',faltou:'Faltou'};
var ICONE={
  pedidos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  dias:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  site:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M7 13h4v4H7z" fill="currentColor"/></svg>',
  numeros:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  mais:'<svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2.6" fill="none"/></svg>',
  wa:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.4-.3z"/></svg>'
};
var estado={vista:'pedidos',siteSub:'precos',dados:null,cfg:null,diasD:null,dirty:false};

function dParse(iso){var p=iso.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function hojeISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function isoDe(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hTxt(h){return h?h.replace(':','h'):''}
function telFmt(t){var m=String(t).match(/^351(\d{3})(\d{3})(\d{3})$/);return m?m[1]+' '+m[2]+' '+m[3]:'+'+t}
function aviso(t){var a=$('#aviso');a.textContent=t;a.classList.add('ve');clearTimeout(aviso.t);aviso.t=setTimeout(function(){a.classList.remove('ve')},2600)}

function api(m,p,corpo,extra){
  var o={method:m,credentials:'same-origin',headers:{}};
  if(corpo instanceof Blob){o.body=corpo;o.headers['Content-Type']=corpo.type;Object.assign(o.headers,extra||{})}
  else if(corpo!==undefined){o.body=JSON.stringify(corpo);o.headers['Content-Type']='application/json'}
  return fetch('/api'+p,o).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(r.status===401&&p!=='/admin/entrar'){mostraEntrar();throw {erro:'sem_sessao'}}
      if(!r.ok){j.status=r.status;throw j}
      return j;
    });
  });
}
function erroTxt(e){
  if(!e) return 'Algo correu mal. Tenta outra vez.';
  if(e.campos) return Object.keys(e.campos).map(function(k){return e.campos[k]}).join(' ');
  return {hora_ocupada:'Essa hora já está ocupada.',limite:'Muitas tentativas seguidas. Espera uns minutos.',estado:'Esse pedido já mudou entretanto. Atualiza a página.',
    grande:'A foto é demasiado grande.',formato:'Esse formato de foto não dá. Usa JPG ou WebP.'}[e.erro]||'Algo correu mal. Tenta outra vez.';
}

/* ---------- entrar ---------- */
function mostraEntrar(){
  $('#app').innerHTML='<div class="entrar"><form id="fEntrar"><h1>Olá, Dayla</h1><p class="sub" style="margin-bottom:24px">Entra para veres os pedidos e mudares o site.</p>'+
    '<div class="campo"><label for="senha">Password</label><input id="senha" type="password" autocomplete="current-password" required></div>'+
    '<p class="erro" id="eEntrar" hidden></p><button class="btn p" style="width:100%" id="bEntrar">Entrar</button></form></div>';
  $('#senha').focus();
  $('#fEntrar').addEventListener('submit',function(e){
    e.preventDefault();var b=$('#bEntrar');b.disabled=true;
    api('POST','/admin/entrar',{senha:$('#senha').value}).then(function(){arranca()})
      .catch(function(e){b.disabled=false;var x=$('#eEntrar');x.hidden=false;x.textContent=e.erro==='limite'?'Muitas tentativas. Espera 15 minutos.':'Password errada.'});
  });
}

/* ---------- estrutura ---------- */
function arranca(){
  $('#app').innerHTML='<header class="topo"><div class="env"><strong>dayla</strong><span>painel</span><a href="/" target="_blank" rel="noopener">Ver site</a></div></header>'+
    '<main class="env" id="vista"></main>'+
    '<button class="mais-btn" id="bNova" aria-label="Nova marcação" hidden>'+ICONE.mais+'</button>'+
    '<nav class="tabs" aria-label="Secções"><div class="in" role="tablist">'+
    [['pedidos','Pedidos'],['dias','Dias'],['site','Site'],['numeros','Números']].map(function(t){
      return '<button role="tab" data-v="'+t[0]+'" aria-selected="'+(estado.vista===t[0])+'">'+ICONE[t[0]]+t[1]+(t[0]==='pedidos'?'<span class="bol" id="bol" hidden></span>':'')+'</button>'}).join('')+
    '</div></nav>';
  $$('.tabs button').forEach(function(b){b.addEventListener('click',function(){muda(b.dataset.v)})});
  $('#bNova').addEventListener('click',novaMarcacao);
  muda(estado.vista);
}
function muda(v){
  if(estado.dirty&&!confirm('Tens alterações nos preços por guardar. Sair mesmo assim?')) return;
  estado.dirty=false;estado.vista=v;
  $$('.tabs button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.v===v)});
  $('#bNova').hidden=v!=='pedidos';
  scrollTo(0,0);
  ({pedidos:vPedidos,dias:vDias,site:vSite,numeros:vNumeros})[v]();
}
function carregaPedidos(){return api('GET','/admin/pedidos').then(function(j){estado.dados=j;var n=j.pedidos.filter(function(p){return p.estado==='pendente'}).length;
  var b=$('#bol');if(b){b.hidden=!n;b.textContent=n}return j})}

/* ---------- pedidos ---------- */
function quandoTxt(p){
  if(p.data) return fDia.format(dParse(p.data))+', '+hTxt(p.hora);
  var pr=p.preferencias||{}, t=[];
  if(pr.dias&&pr.dias.length) t.push(pr.dias.map(function(d){return SEMANA[d]}).join(', '));
  if(pr.periodos&&pr.periodos.length) t.push(pr.periodos.map(function(x){return PER[x]}).join(', '));
  if(pr.texto) t.push('«'+pr.texto+'»');
  return t.join(' · ')||'sem dia';
}

function itemPedido(p,comData){

function vPedidos(){

    h+='<section class="bloco"><h2>Próximas marcações</h2>';

function msg(tipo,p,extra){
  var en=p.idioma==='en', nome=(p.nome||'').split(' ')[0], e=p.estudio?estudioDe(p.estudio):null;
  var quando=p.data?(en?fLongoEn:fLongo).format(dParse(p.data))+(en?' at '+p.hora:' às '+hTxt(p.hora)):'';
  var onde=e?e.nome+(e.rua?', '+e.rua:'')+(e.cidade?', '+e.cidade:''):'';
  var pierc=p.servicos.length?p.servicos.join(', '):'';
  var euroEn=new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
  var tot=p.total!=null&&!(p.total===0&&p.desde)?(en?'Price: '+(p.desde?'from ':'')+euroEn.format(p.total||0):'Valor: '+totalTxt(p)):'';
  if(en) pierc=p.servicos_ids.map(function(i){var s=estado.dados.servicos.filter(function(x){return x.id===i})[0];return s?s.en:i}).join(', ');
  var T={
    confirmar:en?['Hi '+nome+'! Your booking is confirmed.','',quando,onde,e&&e.mapa?e.mapa:'',pierc,tot,'','Before you come: have something to eat and bring an ID. Any questions, just message me!','Dayla']
               :['Olá '+nome+'! A tua marcação está confirmada.','',quando,onde,e&&e.mapa?e.mapa:'',pierc,tot,'','Antes de vires: come qualquer coisa e traz um documento de identificação. Qualquer dúvida, diz-me!','Dayla'],
    responder:en?['Hi '+nome+'! I got your request'+(pierc?' ('+pierc+')':'')+'. ']:['Olá '+nome+'! Recebi o teu pedido'+(pierc?' ('+pierc+')':'')+'. '],
    lembrete:en?['Hi '+nome+'! Just a reminder: '+quando+(onde?', at '+onde:'')+'. See you soon!','Dayla']:['Olá '+nome+'! Só para lembrar: '+quando+(onde?', no '+onde:'')+'. Até já!','Dayla'],
    recusar:en?['Hi '+nome+'! Thanks for your request. Unfortunately I can’t make that time. Shall we look at another day?']:['Olá '+nome+'! Obrigada pelo pedido. Infelizmente não consigo nesse horário. Vemos outro dia?'],
    cuidados:en?['Hi '+nome+'! How is your piercing doing? Remember: saline twice a day, don’t twist the jewellery, and no pools or sea for the first weeks. Anything at all, message me.','Dayla']
               :['Olá '+nome+'! Como está o piercing? Lembra-te: soro fisiológico duas vezes por dia, não rodar a joia e nada de piscina ou mar nas primeiras semanas. Qualquer coisa, diz-me.','Dayla'],
    avaliacao:en?['Hi '+nome+'! Thanks so much for coming. If you can, leave me a quick review here (it takes a minute): '+(extra||'')]
               :['Olá '+nome+'! Obrigada pela visita. Se puderes, deixa-me a tua opinião aqui (é só um minuto): '+(extra||'')]
  }[tipo];
  return T.filter(function(l,i,a){return l!==''||(a[i-1]!=='')}).join('\n').replace(/\n{3,}/g,'\n\n').trim();
}

          abreFolha('Confirmado','<p style="font-size:18px">'+esc(q.nome)+': <b>'+esc(fLongo.format(dParse(q.data))+', '+hTxt(q.hora))+'</b>.</p><p class="sub" style="margin-top:6px">Manda-lhe a confirmação com a morada'+(q.idioma==='en'?' (vai em inglês)':'')+'.</p>'+

/* fotos: reduz no telemóvel antes de enviar (WebP, ou JPEG se o aparelho não fizer WebP) */
function reduz(ficheiro,max){
  return new Promise(function(ok,falha){
    var img=new Image(), url=URL.createObjectURL(ficheiro);
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      cv.toBlob(function(b){
        if(b&&b.type==='image/webp'&&b.size<2900000) return ok({blob:b,w:w,h:h});
        cv.toBlob(function(j){j?ok({blob:j,w:w,h:h}):falha()},'image/jpeg',.84);
      },'image/webp',.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);falha()};img.src=url;
  });
}
function envia(slot,ficheiro){
  aviso('A enviar a foto…');
  return reduz(ficheiro,1800).then(function(r){return api('POST','/admin/fotos/'+slot,r.blob,{'X-Largura':String(r.w),'X-Altura':String(r.h)})})
    .catch(function(e){aviso(e&&e.erro?erroTxt(e):'Não deu para ler essa foto.');throw e});
}

        '<div class="campo"><label for="cLing">Língua</label><select id="cLing"><option value="pt">Português</option><option value="en">Inglês</option></select></div><div class="acoes"><button class="btn p" id="cOk">Criar link</button></div><div id="cRes"></div>',function(f){
        $('#cOk',f).addEventListener('click',function(){api('POST','/admin/convites',{nome:$('#cNome',f).value,piercing:$('#cPierc',f).value,idioma:$('#cLing',f).value}).then(function(r){
          var link=location.origin+'/avaliar/#'+r.token, p={nome:r.nome||'',idioma:r.idioma,servicos:[],servicos_ids:[]};
          var texto=msg('avaliacao',p,link).replace('Olá ! ','Olá! ').replace('Hi ! ','Hi! ');
          $('#cRes',f).innerHTML='<div class="secao"><p class="rot">O link</p><p style="overflow-wrap:anywhere">'+esc(link)+'</p><div class="acoes"><a class="btn p" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(texto)+'">'+ICONE.wa+'Mandar no WhatsApp</a><button class="btn" id="cCop">Copiar</button></div></div>';
          $('#cCop',f).addEventListener('click',function(){navigator.clipboard&&navigator.clipboard.writeText(link).then(function(){aviso('Link copiado')})});
          $('#cOk',f).hidden=true;
        }).catch(function(e){aviso(erroTxt(e))})});
      });
    });
    $$('[data-av]',box).forEach(function(b){b.addEventListener('click',function(){api('POST','/admin/avaliacoes/'+b.dataset.av+'/visivel',{visivel:b.dataset.vis==='1'}).then(sAvaliacoes)})});
    $('#gG',box).addEventListener('click',function(){api('POST','/admin/google',{url:$('#gUrl',box).value}).then(function(){aviso('Guardado')}).catch(function(e){aviso(erroTxt(e))})});
  });
}
function sJoias(){
  var box=$('#siteC');
  api('GET','/admin/joias').then(function(j){
    var h='<p class="sub" style="margin-top:20px">Joias que tens para vender. Enquanto não houver nenhuma visível, o site não mostra esta parte.</p><div class="acoes"><button class="btn p" id="jNova">'+ICONE.mais+'Juntar joia</button></div>';
    h+=j.joias.length?'<ul class="lista" style="margin-top:20px">'+j.joias.map(function(x){var q=x.quantidade;return '<li><button class="item" data-j="'+x.id+'"><span class="q" style="width:58px;height:58px;padding:0;overflow:hidden;background:var(--papel-2);border-radius:4px">'+(x.foto_src?'<img src="'+esc(x.foto_src)+'" alt="" style="width:100%;height:100%;object-fit:cover">':'')+'</span><span class="t"><b>'+esc(x.nome)+(x.visivel?'':' <span class="etq">escondida</span>')+'</b><span>'+esc(x.material||'')+'</span><span>'+(q==null?'sem contagem':q<=0?'esgotada':q+' em stock')+'</span></span><span class="d">'+(x.preco!=null?esc(euro.format(x.preco)):'—')+'</span></button></li>'}).join('')+'</ul>':'';
    box.innerHTML=h;
    $('#jNova',box).addEventListener('click',function(){editaJoia(null)});
    $$('[data-j]',box).forEach(function(b){b.addEventListener('click',function(){editaJoia(j.joias.filter(function(x){return x.id===+b.dataset.j})[0])})});
  });
}
function editaJoia(x){
  var h='<div class="campo"><label for="jNome">Nome</label><input id="jNome" maxlength="50" value="'+esc(x?x.nome:'')+'"></div>'+
    '<div class="campo"><label for="jMat">Material</label><input id="jMat" maxlength="40" placeholder="Titânio, aço cirúrgico…" value="'+esc(x?x.material:'')+'"></div>'+
    '<div class="grelha"><div class="campo"><label for="jPr">Preço (€)</label><input id="jPr" type="number" inputmode="numeric" min="0" max="999" value="'+(x&&x.preco!=null?x.preco:'')+'"></div><div class="campo"><label for="jQ">Quantas tens</label><input id="jQ" type="number" inputmode="numeric" min="0" max="999" placeholder="não contar" value="'+(x&&x.quantidade!=null?x.quantidade:'')+'"></div></div>'+
    '<label style="display:flex;gap:10px;align-items:center;font-weight:600;margin-bottom:16px"><input type="checkbox" id="jVis"'+(!x||x.visivel?' checked':'')+' style="width:22px;height:22px"> Aparece no site</label>'+
    (x?'<div class="perfil" style="margin-bottom:16px"><figure>'+(x.foto_src?'<img src="'+esc(x.foto_src)+'" alt="">':'')+'</figure><div class="acoes" style="margin:0"><label class="btn carrega">'+(x.foto_src?'Trocar foto':'Pôr foto')+'<input type="file" accept="image/*" hidden id="jFoto"></label></div></div>':'<p class="ajuda" style="margin-bottom:12px">A foto põe-se depois de guardar.</p>')+
    '<p class="erro" id="jErr" hidden></p><div class="acoes"><button class="btn p" id="jOk">Guardar</button>'+(x?'<button class="btn verm" id="jApa">Apagar</button>':'')+'<button class="btn" data-fechar>Cancelar</button></div>';
  abreFolha(x?x.nome:'Nova joia',h,function(f){
    function num(id){var v=$(id,f).value.trim();return v===''?null:parseInt(v,10)}
    $('#jOk',f).addEventListener('click',function(){
      api('POST','/admin/joias'+(x?'/'+x.id:''),{nome:$('#jNome',f).value,material:$('#jMat',f).value,preco:num('#jPr'),quantidade:num('#jQ'),visivel:$('#jVis',f).checked})
        .then(function(r){aviso('Joia guardada');if(!x){editaJoia(r);sJoias()}else{fecha();sJoias()}}).catch(function(e){var r=$('#jErr',f);r.hidden=false;r.textContent=erroTxt(e)});
    });
    if(x){
      $('#jFoto',f).addEventListener('change',function(e){var fi=e.target.files[0];if(!fi)return;envia('joia'+x.id,fi).then(function(r){x.foto_src=r.foto_src;editaJoia(x);sJoias()}).catch(function(){})});
      $('#jApa',f).addEventListener('click',function(){if(!confirm('Apagar esta joia?'))return;api('POST','/admin/joias/'+x.id+'/apagar',{}).then(function(){fecha();sJoias()})});
    }
  });
}
function sContactos(){
  var c=estado.cfg.contactos, box=$('#siteC');
  box.innerHTML='<form id="fCont" class="secao" style="border:0;margin-top:8px"><h3>Contactos no site</h3>'+
    '<div class="campo"><label for="kWa">WhatsApp</label><input id="kWa" type="tel" value="+'+esc(c.whatsapp)+'"></div>'+
    '<div class="campo"><label for="kIg">Instagram</label><input id="kIg" value="'+esc(c.instagram)+'" placeholder="sem @"></div>'+
    '<div class="campo"><label for="kEm">Email <small style="font-weight:400;color:var(--sec)">(opcional)</small></label><input id="kEm" type="email" value="'+esc(c.email)+'"></div>'+
    '<p class="erro" id="kErr" hidden></p><button class="btn p">Guardar contactos</button></form>'+
    '<form id="fSenha" class="secao"><h3>Mudar password</h3><div class="campo"><label for="sA">Password atual</label><input id="sA" type="password" autocomplete="current-password"></div>'+
    '<div class="campo"><label for="sN">Password nova</label><input id="sN" type="password" autocomplete="new-password" minlength="10"><p class="ajuda">Pelo menos 10 caracteres. Os outros telemóveis onde entraste saem.</p></div>'+
    '<p class="erro" id="sErr" hidden></p><button class="btn">Mudar password</button></form>'+
    '<div class="secao"><button class="btn verm" id="sair">Sair deste telemóvel</button></div>';
  $('#fCont').addEventListener('submit',function(e){e.preventDefault();api('POST','/admin/contactos',{whatsapp:$('#kWa').value,instagram:$('#kIg').value,email:$('#kEm').value})
    .then(function(j){estado.cfg.contactos=j.contactos;aviso('Contactos guardados')}).catch(function(x){var r=$('#kErr');r.hidden=false;r.textContent=erroTxt(x)})});
  $('#fSenha').addEventListener('submit',function(e){e.preventDefault();api('POST','/admin/senha',{atual:$('#sA').value,nova:$('#sN').value})
    .then(function(){aviso('Password mudada');$('#sA').value='';$('#sN').value='';$('#sErr').hidden=true}).catch(function(x){var r=$('#sErr');r.hidden=false;r.textContent=erroTxt(x)})});
  $('#sair').addEventListener('click',function(){api('POST','/admin/sair',{}).then(mostraEntrar,mostraEntrar)});
}

/* ---------- números ---------- */
var periodo=30;
function n0(v){return v==null?'—':new Intl.NumberFormat('pt-PT').format(v)}
function vNumeros(){
  var c=$('#vista');
  c.innerHTML='<div class="vista"><h1>Números</h1><div class="chips" style="margin-top:12px" id="per">'+[7,30,90,365].map(function(d){return '<button type="button" data-d="'+d+'" aria-pressed="'+(d===periodo)+'">'+(d===365?'1 ano':d+' dias')+'</button>'}).join('')+'</div><div id="numC"><p class="sub" style="margin-top:20px">A carregar…</p></div></div>';
  $$('#per button').forEach(function(b){b.addEventListener('click',function(){periodo=+b.dataset.d;vNumeros()})});
  api('GET','/admin/numeros?dias='+periodo).then(function(j){
    var n=j.negocio, s=j.site&&!j.site.erro?j.site:null, r=s&&s.resumo?s.resumo:{};
    var h='<div class="kpis" style="margin-top:20px">'+
      '<div class="kpi rosa"><b>'+n.pedidos+'</b><span>pedidos</span></div>'+
      '<div class="kpi"><b>'+n.feitos+'</b><span>piercings feitos</span></div>'+
      '<div class="kpi"><b>'+euro.format(n.faturacao)+'</b><span>faturado (feitos)</span></div>'+
      '<div class="kpi"><b>'+n.proximos+'</b><span>marcados (30 dias)</span></div>'+
      '<div class="kpi"><b>'+n.em_ingles+'</b><span>pedidos em inglês</span></div>'+
      (s?'<div class="kpi"><b>'+n0(r.visitantes)+'</b><span>pessoas no site</span></div>':'<div class="kpi"><b>'+(n.avaliacoes.media?String(n.avaliacoes.media).replace('.',','):'—')+'</b><span>média das avaliações</span></div>')+'</div>';
    var se=n.semanas, mx=Math.max.apply(null,se.map(function(x){return x.n}).concat(1));
    h+='<div class="bloco"><h2>Pedidos por semana</h2><div class="grafico" role="img" aria-label="Pedidos nas últimas 8 semanas">'+se.map(function(x){return '<i class="'+(x.n?'':'zero')+'" style="height:'+Math.max(2,x.n/mx*100)+'%" title="'+x.de+': '+x.n+'"></i>'}).join('')+'</div><div class="eixo"><span>há 8 semanas</span><span>esta semana</span></div></div>';
    if(s){
      var serie=s.serie||[], mv=Math.max.apply(null,serie.map(function(x){return x.visitantes}).concat(1));
      h+='<div class="bloco"><h2>Pessoas no site por dia</h2><p class="sub">'+n0(r.visitas)+' visitas'+(r.tempo_medio_s!=null?', '+r.tempo_medio_s+' s em média':'')+'. Cada pessoa conta uma vez por dia, sem cookies.</p><div class="grafico" role="img" aria-label="Pessoas por dia">'+serie.map(function(x){return '<i class="'+(x.visitantes?'':'zero')+'" style="height:'+Math.max(2,x.visitantes/mv*100)+'%" title="'+x.quando+': '+x.visitantes+'"></i>'}).join('')+'</div></div>';
      var fo=(s.fontes||[]).slice(0,6), mf=Math.max.apply(null,fo.map(function(x){return x.visitas}).concat(1));
      h+='<div class="bloco"><h2>De onde vêm</h2>'+(fo.length?'<div class="barras-h">'+fo.map(function(x){return '<div><span>'+esc(x.fonte==='Direto'?'Direto (link escrito ou guardado)':x.fonte)+'</span><b>'+n0(x.visitas)+'</b><i style="--w:'+(x.visitas/mf*100)+'%"></i></div>'}).join('')+'</div>':'<p class="vazio">Ainda sem visitas neste período.</p>')+'</div>';
      var ac=(s.acoes||[]).filter(function(x){return x.n});
      var NA={whatsapp:'WhatsApp',telefone:'Telefone',email:'Email',instagram:'Instagram',formulario:'Formulário',fora:'Links para fora',pedido:'Pedidos enviados'};
      h+='<div class="bloco"><h2>O que tocam</h2>'+(ac.length?'<div class="barras-h">'+ac.map(function(x){return '<div><span>'+esc(NA[x.nome]||x.nome)+'</span><b>'+n0(x.n)+'</b></div>'}).join('')+'</div>':'<p class="vazio">Ainda ninguém tocou no WhatsApp ou no Instagram neste período.</p>')+'</div>';
    } else h+='<div class="bloco"><h2>Pessoas no site</h2><p class="vazio">As visitas do site não estão disponíveis agora. Os números dos pedidos estão certos.</p></div>';
    var top=n.top, mt=Math.max.apply(null,top.map(function(x){return x.n}).concat(1));
    h+='<div class="bloco"><h2>Mais pedidos</h2>'+(top.length?'<div class="barras-h">'+top.map(function(x){return '<div><span>'+esc(x.nome)+'</span><b>'+x.n+'</b><i style="--w:'+(x.n/mt*100)+'%"></i></div>'}).join('')+'</div>':'<p class="vazio">Ainda sem pedidos neste período.</p>')+'</div>';
    var e=n.estados;
    h+='<div class="bloco"><h2>Como acabaram os pedidos</h2><div class="barras-h"><div><span>Feitos</span><b>'+e.concluida+'</b></div><div><span>Confirmados (por fazer)</span><b>'+e.confirmada+'</b></div><div><span>Por responder</span><b>'+e.pendente+'</b></div><div><span>Faltou</span><b>'+e.faltou+'</b></div><div><span>Cancelados</span><b>'+e.cancelada+'</b></div><div><span>Recusados</span><b>'+e.recusada+'</b></div></div></div>';
    $('#numC').innerHTML=h;
  }).catch(function(e){if(e.erro!=='sem_sessao')$('#numC').innerHTML='<p class="vazio">Não deu para carregar.</p>'});
}

addEventListener('beforeunload',function(e){if(estado.dirty){e.preventDefault();e.returnValue=''}});
api('GET','/admin/estado').then(arranca).catch(function(e){if(e.erro!=='sem_sessao')mostraEntrar()});
})();
