<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Avaliar · Dayla Araújo Body Piercing</title>
<meta name="theme-color" content="#101010">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Archivo;src:url(/fonts/archivo.woff2) format("woff2-variations"),url(/fonts/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
:root{--papel:#F5F5F3;--papel-2:#E8E8E4;--tinta:#101010;--rosa:#F7B8D2;--rosa-tinta:#B02A66;--sec:#545454}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.5}
.xz{height:28px;background:conic-gradient(var(--tinta) 25%,#fff 0 50%,var(--tinta) 0 75%,#fff 0) 0 0/28px 28px}
main{max-width:560px;margin:0 auto;padding:40px 20px 64px}
.logo{display:block;width:120px;margin-bottom:40px}
h1{margin:0;font-weight:820;font-stretch:72%;font-size:clamp(44px,12vw,64px);line-height:.95;letter-spacing:-.02em;text-wrap:balance}
p{margin:12px 0 0}
.sec{color:var(--sec)}
fieldset{border:0;padding:0;margin:32px 0 0}
legend{font-weight:700;margin-bottom:10px;padding:0}
.estrelas{display:flex;gap:8px}
.estrelas label{cursor:pointer}
.estrelas input{position:absolute;opacity:0;width:1px;height:1px}
.estrelas span{display:grid;place-items:center;width:56px;height:56px;border:2px solid var(--tinta);border-radius:6px;background:#fff;transition:background-color .15s,transform .15s}
.estrelas svg{width:28px;height:28px}
.estrelas .on span{background:var(--rosa)}
.estrelas input:focus-visible+span{outline:3px solid var(--tinta);outline-offset:2px}
.estrelas label:active span{transform:scale(.94)}
.campo{margin-top:22px}
label.r{display:block;font-weight:700;margin-bottom:8px}
label.r small{font-weight:400;color:var(--sec)}
textarea,input[type=text]{width:100%;min-height:52px;padding:12px 16px;border:2px solid var(--tinta);border-radius:6px;background:#fff;font:inherit}
textarea{min-height:130px;resize:vertical}
:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 26px;border-radius:999px;border:2px solid var(--tinta);background:var(--rosa);font:inherit;font-weight:700;cursor:pointer;text-decoration:none;color:var(--tinta);margin-top:28px}
.btn.s{background:transparent}
.btn[disabled]{opacity:.5}
.erro{color:var(--rosa-tinta);font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="xz" aria-hidden="true"></div>
<main>
  <a href="/" aria-label="Dayla Araújo Body Piercing"><img class="logo" src="/logo.svg" alt="Dayla" width="120" height="48"></a>
  <div id="a-carregar"><p class="sec" data-t="carregar">A abrir…</p></div>
  <div id="a-erro" hidden><h1 data-t="erro_t">Este link já não dá.</h1><p id="a-erro-p"></p><a class="btn s" href="/" data-t="ir">Ir para o site</a></div>
  <form id="a-form" hidden>
    <h1 id="a-ola"></h1>
    <p class="sec" id="a-sub"></p>
    <fieldset><legend data-t="quantas">Quantas estrelas dás?</legend><div class="estrelas" id="est"></div></fieldset>
    <p class="erro" id="e-est" hidden></p>
    <div class="campo"><label class="r" for="texto"><span data-t="conta">Conta como correu</span> <small data-t="opc">(opcional)</small></label><textarea id="texto" maxlength="600"></textarea></div>
    <div class="campo"><label class="r" for="nome"><span data-t="nome">O teu nome como aparece no site</span> <small data-t="opc">(opcional)</small></label><input type="text" id="nome" maxlength="40" autocomplete="given-name"></div>
    <p class="erro" id="e-geral" hidden></p>
    <button class="btn" id="enviar" data-t="enviar">Enviar avaliação</button>
  </form>
  <div id="a-ok" hidden><h1 data-t="ok_t">Obrigada!</h1><p data-t="ok_p">A tua avaliação já está no site.</p><div id="a-google"></div><a class="btn s" href="/" data-t="ir">Ir para o site</a></div>
</main>
<script>
(function(){
var T={en:{carregar:'Opening…',erro_t:'This link no longer works.',ir:'Go to the website',quantas:'How many stars?',conta:'Tell me how it went',opc:'(optional)',nome:'Your name as it will appear',enviar:'Send review',ok_t:'Thank you!',ok_p:'Your review is already on the website.',
  ola:'Hi{n}! How was it?',sub:'Your review goes straight onto the website.',usado:'This link has already been used for a review.',expirado:'This link has expired. Ask Dayla for a new one.',nao:'This link doesn’t exist. Check you copied it in full.',
  est:'Pick from 1 to 5 stars.',rede:'Couldn’t send it. Check your connection and try again.',google:'Would you leave it on Google too?',google_b:'Review on Google',estrelas:' stars'},
  pt:{ola:'Olá{n}! Como correu?',sub:'A tua avaliação aparece logo no site.',usado:'Este link já foi usado para uma avaliação.',expirado:'Este link expirou. Pede um novo à Dayla.',nao:'Este link não existe. Confirma que o copiaste inteiro.',
  est:'Escolhe de 1 a 5 estrelas.',rede:'Não deu para enviar. Verifica a ligação e tenta outra vez.',google:'Deixas também no Google?',google_b:'Avaliar no Google',estrelas:' estrelas'}};
var L='pt', $=function(s){return document.querySelector(s)}, token=location.hash.slice(1), estrelas=0;
var SV='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.8l2.5 5.3 5.7.7-4.2 4 1.1 5.7L10 14.8l-5.1 2.7 1.1-5.7-4.2-4 5.7-.7z" fill="#101010"/></svg>';
function t(k){return (T[L]&&T[L][k])||T.pt[k]}
function lingua(l){L=l==='en'?'en':'pt';document.documentElement.lang=L==='en'?'en':'pt-PT';if(L==='en')Array.prototype.forEach.call(document.querySelectorAll('[data-t]'),function(e){var v=T.en[e.getAttribute('data-t')];if(v)e.textContent=v})}
function erro(k){$('#a-carregar').hidden=true;$('#a-form').hidden=true;$('#a-erro').hidden=false;$('#a-erro-p').textContent=t(k)}
function post(p,c){return fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)}).then(function(r){return r.json().then(function(j){return {s:r.status,j:j}})})}
if(!/^[A-Za-z0-9_\-]{12,40}$/.test(token)){erro('nao');return}
post('/api/convite',{token:token}).then(function(x){
  if(x.s!==200){lingua(navigator.language&&navigator.language.slice(0,2)!=='pt'?'en':'pt');return erro(x.j.erro==='usado'?'usado':x.j.erro==='expirado'?'expirado':'nao')}
  lingua(x.j.idioma);
  $('#a-ola').textContent=t('ola').replace('{n}',x.j.nome?', '+x.j.nome:'');
  $('#a-sub').textContent=(x.j.piercing?x.j.piercing+'. ':'')+t('sub');
  var h='';for(var i=1;i<=5;i++)h+='<label><input type="radio" name="e" value="'+i+'" aria-label="'+i+t('estrelas')+'"><span>'+SV+'</span></label>';
  $('#est').innerHTML=h;
  $('#est').addEventListener('change',function(e){estrelas=+e.target.value;$('#e-est').hidden=true;Array.prototype.forEach.call($('#est').children,function(l,n){l.classList.toggle('on',n<estrelas)})});
  $('#a-carregar').hidden=true;$('#a-form').hidden=false;
}).catch(function(){erro('rede')});
$('#a-form').addEventListener('submit',function(e){
  e.preventDefault();
  if(!estrelas){var x=$('#e-est');x.textContent=t('est');x.hidden=false;return}
  var b=$('#enviar');b.disabled=true;
  post('/api/avaliacoes',{token:token,estrelas:estrelas,texto:$('#texto').value,nome:$('#nome').value}).then(function(x){
    b.disabled=false;
    if(x.s===201){$('#a-form').hidden=true;$('#a-ok').hidden=false;
      if(estrelas===5&&x.j.google&&/^https:\/\//.test(x.j.google)) $('#a-google').innerHTML='<p>'+t('google')+'</p><a class="btn" target="_blank" rel="noopener" href="'+x.j.google.replace(/"/g,'')+'">'+t('google_b')+'</a>';
      return}
    if(x.j.erro==='usado'||x.j.erro==='expirado') return erro(x.j.erro);
    var g=$('#e-geral');g.textContent=x.j.campos?Object.keys(x.j.campos).map(function(k){return x.j.campos[k]}).join(' '):t('rede');g.hidden=false;
  }).catch(function(){b.disabled=false;var g=$('#e-geral');g.textContent=t('rede');g.hidden=false});
});
})();
</script>
</body>
</html>
