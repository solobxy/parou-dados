<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1C1B1D">
<title>Painel — AdriBodyPiercing</title>
<link rel="icon" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face{font-family:"Bricolage Grotesque";src:url(/fonts/bricolage.woff) format("woff");font-weight:200 800;font-display:swap}
@font-face{font-family:"Figtree";src:url(/fonts/figtree.woff) format("woff");font-weight:300 900;font-display:swap}
:root{--noite:#1C1B1D;--noite-2:#252427;--noite-3:#323135;--osso:#EFEAE3;--osso-2:#E5DFD6;--osso-3:#D6CFC4;--tinta:#1C1B1D;--sec:#B9B7BC;--sec-c:#55524E;--acento:#4258DE;--acento-2:#3449C9;--acento-claro:#9AA8FF;--verde:#2F8F4E;--ambar:#C98A1E;--verm:#B3261E;
  --serif:"Bricolage Grotesque",system-ui,sans-serif;--sans:"Figtree",system-ui,sans-serif;--ease:cubic-bezier(.2,.7,.2,1);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--noite);color:var(--osso);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100svh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--acento-claro);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--serif);margin:0;letter-spacing:-.02em}
.wrap{max-width:860px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) calc(40px + env(safe-area-inset-bottom))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:0;border-radius:999px;background:var(--acento);color:#fff;font-weight:600;text-decoration:none;white-space:nowrap;transition:transform .15s var(--ease),background-color .2s}
@media (hover:hover){.btn:hover{background:var(--acento-2)}.btn.esc:hover{background:#3C3B40}.btn.osso:hover{background:#fff}}
.btn:active{transform:scale(.97)}
.btn.esc{background:var(--noite-3);color:var(--osso)}
.btn.osso{background:var(--osso);color:var(--tinta)}
.btn.verm{background:#3a1d1a;color:#ffd9d2}
.btn.peq{min-height:40px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.5;cursor:wait}
.btn svg{width:18px;height:18px}
/* entrar */
.entrar{min-height:100svh;display:grid;place-items:center;padding:24px}
.entrar form{width:min(100%,380px);text-align:center}
.entrar .m{width:84px;margin:0 auto 22px}
.entrar h1{font-size:30px;margin-bottom:6px}
.entrar p{color:var(--sec);margin:0 0 24px}
.campo{display:grid;gap:6px;text-align:left;margin-bottom:14px}
.campo label{font-weight:600;font-size:14px}
input,select,textarea{width:100%;min-height:50px;padding:12px 14px;border-radius:12px;border:2px solid transparent;background:var(--noite-3);color:var(--osso)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acento-claro)}
textarea{min-height:80px;resize:vertical}
.erro{color:#ffb4a8;font-weight:600;font-size:14px;margin:4px 0 12px}
/* topo */
.topo{position:sticky;top:0;z-index:20;background:var(--noite);padding:calc(10px + env(safe-area-inset-top)) 0 0}
.topo .linha{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
.topo .m{width:34px;height:34px;background:var(--noite-3);border-radius:10px;padding:4px}
.topo h1{font-size:22px;margin-right:auto}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:12px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:42px;padding:0 16px;border-radius:999px;border:0;background:var(--noite-3);color:var(--osso);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.tabs button[aria-selected="true"]{background:var(--osso);color:var(--tinta)}
.tabs .n{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--acento);color:#fff;font-size:13px;display:inline-grid;place-items:center}
/* secções (Agenda, Site, Números) */
.secoes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--noite-2);padding:4px;border-radius:999px;margin-bottom:10px}
.secoes button{min-height:42px;border:0;border-radius:999px;background:transparent;color:var(--osso);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.secoes button[aria-pressed="true"]{background:var(--osso);color:var(--tinta)}
.secoes .n{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--acento);color:#fff;font-size:12px;display:inline-grid;place-items:center}
.ajuda-t{color:var(--sec);margin:0 0 14px;font-size:15px}
.painel h2{font-size:22px;margin-bottom:6px}
.grupo-t{font-family:var(--serif);font-weight:600;font-size:17px;margin:22px 0 6px;color:var(--osso)}
.linha-p{display:grid;grid-template-columns:minmax(0,1fr) 112px;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--noite-3)}
.linha-p:first-of-type{border-top:0}
.linha-p label{font-weight:500}
.linha-p small{display:block;color:var(--sec);font-size:13px}
.linha-p.mudou label{color:var(--acento-claro)}
.euro{position:relative}
.euro input{padding-right:34px;text-align:right;font-variant-numeric:tabular-nums;min-height:46px}
.euro::after{content:"€";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--sec);pointer-events:none}
.barra-guardar{position:sticky;bottom:0;z-index:5;margin:16px -18px -18px;padding:14px 18px calc(14px + env(safe-area-inset-bottom));background:var(--noite-2);border-top:1px solid var(--noite-3);border-radius:0 0 20px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.barra-guardar p{margin:0;font-size:14px;color:var(--sec)}
.dia-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--noite-3)}
.dia-h:first-of-type{border-top:0}
.dia-h .nome{font-weight:600}
.dia-h .horas-d{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dia-h .horas-d label{font-size:13px;color:var(--sec);display:grid;gap:4px}
.dia-h select{min-height:46px}
.interruptor{position:relative;width:52px;height:32px;flex:none}
.interruptor input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;min-height:0}
.interruptor span{position:absolute;inset:0;border-radius:999px;background:var(--noite-3);transition:background-color .2s var(--ease);pointer-events:none}
.interruptor span::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:var(--osso);transition:transform .2s var(--ease)}
.interruptor input:checked+span{background:var(--acento)}
.interruptor input:checked+span::after{transform:translateX(20px)}
.interruptor input:focus-visible+span{outline:3px solid var(--acento-claro);outline-offset:2px}
.previa{margin-top:14px;padding:14px;border-radius:14px;background:var(--noite-3);font-size:14px}
.previa b{display:block;font-size:16px;margin-bottom:4px}
.aviso-v{margin-top:12px;padding:12px;border-radius:14px;background:#3a1d1a;color:#ffd9d2;font-size:14px}
.fotos-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:16px}
.foto-c{background:var(--noite-2);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.foto-c .img{aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--noite-3)}
.foto-c .img.redonda{aspect-ratio:1;width:120px;border-radius:50%;margin:0 auto}
.foto-c img{width:100%;height:100%;object-fit:cover;display:block}
.foto-c h3{font-size:17px}
.foto-c p{margin:0;font-size:14px;color:var(--sec)}
.foto-c .acoes{margin-top:auto}
.etq{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--noite-3);font-size:12px;font-weight:600;color:var(--sec)}
.etq.nova{background:#20264d;color:var(--acento-claro)}
.prev-nova{border-radius:14px;overflow:hidden;background:var(--noite-3);margin-bottom:14px;max-height:46vh;display:grid;place-items:center}
.prev-nova img{max-width:100%;max-height:46vh;display:block}
.estr{color:var(--acento-claro);letter-spacing:1px}
.estr .v{color:var(--noite-3)}
.aval{padding:14px 0;border-top:1px solid var(--noite-3)}
.aval:first-of-type{border-top:0}
.aval blockquote{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.aval .meta{font-size:13px;color:var(--sec)}
.aval.escondida{opacity:.55}
.link-box{display:flex;gap:8px;align-items:stretch}
.link-box input{font-size:14px;min-height:46px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--noite-2);border-radius:18px;padding:14px 16px;min-width:0}
.kpi b{display:block;font-family:var(--serif);font-weight:650;font-size:30px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi span{font-size:13px;color:var(--sec);display:block;margin-top:4px}
.grafico{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:12px}
.grafico i{flex:1;min-width:2px;background:var(--acento);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.grafico i.zero{background:var(--noite-3)}
.eixo{display:flex;justify-content:space-between;font-size:12px;color:var(--sec);margin-top:6px}
.barras-h{display:grid;gap:8px;margin-top:10px}
.barras-h div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.barras-h i{grid-column:1/-1;height:6px;border-radius:6px;background:var(--noite-3);overflow:hidden;display:block}
.barras-h i::before{content:"";display:block;height:100%;width:var(--w);background:var(--acento-claro);border-radius:6px}
/* listas */
.dia-t{font-family:var(--serif);font-weight:600;font-size:18px;margin:26px 0 10px;color:var(--sec)}
.vazio{color:var(--sec);padding:30px 0;text-align:center}
.card{background:var(--noite-2);border-radius:20px;padding:18px;margin-bottom:10px;animation:entra .35s var(--ease)}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card .cab{display:flex;align-items:flex-start;gap:14px}
.hora{flex:none;min-width:74px;text-align:center;background:var(--noite-3);border-radius:14px;padding:8px 6px}
.hora b{display:block;font-family:var(--serif);font-size:22px;line-height:1.1}
.hora span{font-size:12px;color:var(--sec)}
.card h3{font-size:19px}
.card .serv{color:var(--osso);margin-top:2px}
.card .mini{color:var(--sec);font-size:14px;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--noite-3);font-size:13px;font-weight:600;margin-top:8px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ambar)}
.pill.confirmada i{background:var(--verde)}.pill.recusada i,.pill.cancelada i,.pill.faltou i{background:var(--verm)}.pill.concluida i{background:var(--sec)}
.notas{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--noite-3);font-size:14px;white-space:pre-wrap}
.acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.contacto{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.aviso{margin-top:12px;padding:12px;border-radius:14px;background:#1f2a1f;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.aviso p{margin:0;font-size:14px}
details.hist{margin-top:10px;font-size:13px;color:var(--sec)}
details.hist ul{margin:6px 0 0;padding-left:18px}
/* formulários */
.painel{background:var(--noite-2);border-radius:20px;padding:18px;margin-top:16px}
.servs{display:flex;flex-wrap:wrap;gap:6px}
.servs label{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;background:var(--noite-3);font-size:14px;cursor:pointer}
.servs input{width:auto;min-height:0;accent-color:var(--acento)}
.horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.horas button{min-height:44px;border-radius:10px;border:0;background:var(--noite-3);color:var(--osso);font-weight:600}
.horas button[aria-pressed="true"]{background:var(--osso);color:var(--tinta)}
.horas button:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.duas{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chips button{min-height:40px;padding:0 14px;border-radius:999px;border:0;background:var(--noite-3);color:var(--osso);font-weight:600;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--osso);color:var(--tinta)}
.msg-txt{min-height:170px;line-height:1.45}
.canais{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.canais .btn{width:100%;padding:0 12px;white-space:normal;text-align:center;line-height:1.2}
.canais .btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.nota-c{color:var(--sec);font-size:13px;margin:10px 0 0}
.lembra{margin-top:12px;padding:12px;border-radius:14px;background:#2a2316;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.lembra p{margin:0;font-size:14px}
.feito{display:inline-flex;align-items:center;gap:6px;margin:8px 0 0 8px;font-size:13px;color:var(--sec)}
.modelo{padding:16px 0}
.modelo+.modelo{border-top:1px solid var(--noite-3)}
.modelo h3{font-size:17px;margin-bottom:4px}
.modelo p{color:var(--sec);font-size:14px;margin:0 0 10px}
.modelo .acoes{margin-top:10px}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.vars code{font:600 13px/1 var(--sans);background:var(--noite-3);padding:7px 10px;border-radius:8px;color:var(--acento-claro)}
.blq{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0}
.blq+.blq{border-top:1px solid var(--noite-3)}
dialog{border:0;padding:0;background:transparent;color:var(--osso);width:min(520px,calc(100vw - 20px));max-height:calc(100dvh - 20px)}
dialog::backdrop{background:rgba(0,0,0,.7)}
.dlg{background:var(--noite-2);border-radius:22px;padding:20px;max-height:calc(100dvh - 20px);overflow:auto}
.dlg h2{font-size:22px;margin-bottom:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:380px){.secoes button{font-size:14px;gap:4px}.secoes .n{min-width:18px;height:18px;font-size:11px;padding:0 5px}}
/* vales de oferta */
.campo .lbl,.lbl-b{display:block;font-weight:600;font-size:14px}
.lbl-b{margin:14px 0 6px}
.ver-linha{display:flex;flex-wrap:wrap;gap:8px}
.ver-linha input{flex:1 1 200px;min-width:0}
.ver-linha .btn{flex:1 0 auto}
.nw{white-space:nowrap}
.cod-in{font-weight:700;font-size:22px;letter-spacing:.14em;text-transform:uppercase;text-align:center;font-variant-numeric:tabular-nums}
.cod-in::placeholder{letter-spacing:.14em;color:#6f6c72}
.res{margin-top:12px;padding:14px 16px;border-radius:16px;animation:entra .3s var(--ease)}
.res .t{display:block;font-family:var(--serif);font-weight:650;font-size:21px;margin-bottom:2px}
.res p{margin:2px 0 0}
.res .acoes{margin-top:12px}
.res.ok{background:#1f2a1f}.res.ok .t{color:#9fe0b0}
.res.usado{background:#2a2316}.res.usado .t{color:#f1c87a}
.res.mal{background:#3a1d1a;color:#ffd9d2}
.vl{padding:16px 0;border-top:1px solid var(--noite-3)}
.vl:first-of-type{border-top:0}
.vl-cab{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.vl-cod{font-weight:700;font-size:18px;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.vl-valor{font-family:var(--serif);font-weight:650;font-size:22px;white-space:nowrap}
.vl .mini{color:var(--sec);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.vl .acoes{margin-top:10px}
.pill.valido i{background:var(--verde)}.pill.usado i{background:var(--sec)}.pill.expirado i{background:var(--verm)}
.vale-img{border-radius:16px;overflow:hidden;background:var(--osso);aspect-ratio:4/5;max-height:50vh;margin:0 auto 4px;display:grid;place-items:center}
.vale-img img{width:100%;height:100%;object-fit:contain;display:block}
.vale-img .vazio{color:var(--sec-c);padding:0}
.canais .larga{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--osso);color:var(--tinta);padding:12px 18px;border-radius:999px;font-weight:600;transition:.3s var(--ease);z-index:50;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<section class="entrar" id="vEntrar" hidden>
  <form id="fEntrar" autocomplete="on">
    <div class="m"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-227 -880 1100 1100" aria-hidden="true" focusable="false"><g class="bar" fill="#4258DE"><rect x="-64" y="-245.0" width="776" height="66" rx="33.0"/><circle cx="-64" cy="-212" r="60"/><circle cx="712" cy="-212" r="60"/></g><g fill="currentColor" transform="translate(0.0 0.0) scale(1 -1)"><path transform="translate(0.0 0)" d="M5 0 230 660H418L641 0H485L325 542H320L160 0Z"/></g></svg></div>
    <h1>Painel do Adri</h1>
    <p>Escreve a password para gerir as marcações e o site.</p>
    <div class="campo"><label for="senha">Password</label><input id="senha" type="password" autocomplete="current-password" required></div>
    <p class="erro" id="eEntrar" role="alert" hidden></p>
    <button class="btn" style="width:100%" id="bEntrar">Entrar</button>
  </form>
</section>

<div id="vApp" hidden>
  <header class="topo"><div class="wrap" style="padding-bottom:0">
    <div class="linha"><div class="m"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-227 -880 1100 1100" aria-hidden="true" focusable="false"><g class="bar" fill="#4258DE"><rect x="-64" y="-245.0" width="776" height="66" rx="33.0"/><circle cx="-64" cy="-212" r="60"/><circle cx="712" cy="-212" r="60"/></g><g fill="currentColor" transform="translate(0.0 0.0) scale(1 -1)"><path transform="translate(0.0 0)" d="M5 0 230 660H418L641 0H485L325 542H320L160 0Z"/></g></svg></div><h1>Painel</h1><button class="btn esc peq" id="bAtualizar" aria-label="Atualizar">Atualizar</button><button class="btn esc peq" id="bSair">Sair</button></div>
    <div class="secoes" role="group" aria-label="Secção do painel">
      <button type="button" data-s="agenda" aria-pressed="true">Agenda <span class="n" id="nPedS" hidden>0</span></button>
      <button type="button" data-s="vales" aria-pressed="false">Vales</button>
      <button type="button" data-s="site" aria-pressed="false">Site</button>
      <button type="button" data-s="numeros" aria-pressed="false">Números</button>
    </div>
    <nav class="tabs" role="tablist" aria-label="Agenda" data-secao="agenda">
      <button role="tab" data-v="pedidos" aria-selected="true">Pedidos <span class="n" id="nPed">0</span></button>
      <button role="tab" data-v="agenda" aria-selected="false">Agenda</button>
      <button role="tab" data-v="nova" aria-selected="false">Nova marcação</button>
      <button role="tab" data-v="bloqueios" aria-selected="false">Bloquear dias</button>
      <button role="tab" data-v="mensagens" aria-selected="false">Mensagens</button>
      <button role="tab" data-v="historico" aria-selected="false">Histórico</button>
    </nav>
    <nav class="tabs" role="tablist" aria-label="Site" data-secao="site" hidden>
      <button role="tab" data-v="precos" aria-selected="false">Preços</button>

  abrirDlg('<h2>' + t + '</h2><p style="color:var(--sec);margin:0 0 12px">' + esc(m.nome) + ', ' + quando(m) + '.</p>' +
    '<div class="campo"><label for="mot">Motivo (opcional, vai na mensagem ao cliente)</label><textarea id="mot" maxlength="300" placeholder="Ex.: Nesse dia não estou no estúdio."></textarea></div>' +
    '<div class="acoes"><button class="btn verm" id="dOk">' + (a === 'recusar' ? 'Recusar' : 'Cancelar marcação') + '</button><button class="btn esc" data-fechar>Voltar</button></div>');
  $('#dOk').addEventListener('click', function(){ acao(m, a, {motivo:$('#mot').value}, $('#dOk')).catch(function(){}); });

function horasDe(data, alvo, atual){
  alvo.innerHTML = '<p style="color:var(--sec)">A ver horas…</p>';
  return api('GET', '/admin/disponibilidade?de=' + data + '&dias=1').then(function(j){
    var o = j.dias[data];
    if (!o){ alvo.innerHTML = '<p style="color:var(--sec)">O estúdio está fechado nesse dia.</p>'; return; }
    alvo.innerHTML = '<div class="horas">' + Object.keys(o).map(function(h){ var livre = o[h] || (atual && atual.data === data && atual.hora === h); return '<button type="button" data-h="' + h + '" aria-pressed="false"' + (livre ? '' : ' disabled') + '>' + h.replace(':', 'h') + '</button>'; }).join('') + '</div>';
    $$('button', alvo).forEach(function(b){ b.addEventListener('click', function(){ $$('button', alvo).forEach(function(x){ x.setAttribute('aria-pressed', x === b); }); alvo.dataset.h = b.dataset.h; }); });
  });
}
function dlgReagendar(m){
  abrirDlg('<h2>Reagendar</h2><p style="color:var(--sec);margin:0 0 12px">' + esc(m.nome) + '. Agora: ' + quando(m) + '.</p>' +
    '<div class="campo"><label for="rd">Novo dia</label><input type="date" id="rd" min="' + hojeISO() + '" value="' + m.data + '"></div><div id="rh"></div>' +
    '<div class="acoes"><button class="btn" id="dOk">Guardar nova hora</button><button class="btn esc" data-fechar>Voltar</button></div>');
  var rh = $('#rh'); horasDe(m.data, rh, m);
  $('#rd').addEventListener('change', function(){ rh.dataset.h = ''; horasDe($('#rd').value, rh, m); });
  $('#dOk').addEventListener('click', function(){
    if (!rh.dataset.h) return toast('Escolhe a nova hora.');
    acao(m, 'reagendar', {data:$('#rd').value, hora:rh.dataset.h}, $('#dOk')).catch(function(){});
  });
}

      '<div class="acoes"><button class="btn peq" data-g="' + k + '">Guardar</button><button class="btn esc peq" data-r="' + k + '"' + (modelos[k] ? '' : ' hidden') + '>Repor o original</button></div></div>'; }).join('') + '</div>';
  function guardar(k, txt, b){

    var corpo = {}; corpo[k] = txt;
    api('POST', '/admin/modelos', {modelos:corpo}).then(function(j){ modelos = j.modelos || {}; toast(txt ? 'Guardado.' : 'Voltou ao texto original.'); editarModelos(c); }, function(){ toast('Não deu para guardar. Tenta outra vez.'); b.disabled = false; });
  }
  $$('[data-g]', c).forEach(function(b){ b.addEventListener('click', function(){ var k = b.dataset.g, v = $('#md-' + k).value.trim(); guardar(k, v === PADRAO[k] ? '' : v, b); }); });
  $$('[data-r]', c).forEach(function(b){ b.addEventListener('click', function(){ guardar(b.dataset.r, '', b); }); });
}

/* =================== SITE: o que o Adri muda aparece logo no site =================== */
var DIAS = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
var DIAS_PL = ['segundas', 'terças', 'quartas', 'quintas', 'sextas', 'sábados', 'domingos'];
function minutos(t){ return +t.slice(0, 2) * 60 + +t.slice(3, 5); }
function hhmm(m){ return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function horasDe2(hor, wd){
  var d = hor && hor.dias && hor.dias[String(wd)]; if (!d) return [];
  var dur = hor.duracao || 60, a = minutos(d.abre), f = minutos(d.fecha), r = [];
  for (var t = a; t + dur <= f; t += dur) r.push(hhmm(t));
  return r;
}
function horasDoDia(wd){ return cfg ? horasDe2(cfg.horario, wd) : []; }
function horarioTexto(hor){
  var g = [];
  for (var w = 0; w < 7; w++){
    var d = hor.dias[String(w)]; if (!d) continue;
    var k = d.abre + '-' + d.fecha;
    if (g.length && g[g.length - 1].k === k && g[g.length - 1].w[g[g.length - 1].w.length - 1] === w - 1) g[g.length - 1].w.push(w); else g.push({k: k, a: d.abre, f: d.fecha, w: [w]});
  }
  var t = g.map(function(x){ var n = x.w.map(function(w){ return DIAS_PL[w]; }); return (n.length < 2 ? n[0] : n.slice(0, -1).join(', ') + ' e ' + n[n.length - 1]) + ', ' + x.a.replace(':', 'h') + '–' + x.f.replace(':', 'h'); }).join('; ');
  return t ? cap(t) : '';
}
function comCfg(c, f){
  if (cfg) return f(c);
  c.innerHTML = '<p class="vazio">A carregar…</p>';
  carregarCfg().then(function(){ if (vista && $('#conteudo') === c) desenhar(); }, function(){ c.innerHTML = '<p class="vazio">Não deu para carregar. Toca em «Atualizar».</p>'; });
}
function erroCampos(x){ var cs = x && x.j && x.j.campos; return cs ? Object.keys(cs).map(function(k){ return cs[k]; }).join(' ') : (x && x.s === 401 ? 'A sessão terminou. Entra outra vez.' : 'Não deu para guardar. Tenta outra vez.'); }
function avisarSaida(on){ window.onbeforeunload = on ? function(){ return 'Tens alterações por guardar.'; } : null; }

  function ler(){

  });
  void base;

/* ---------- Horário e morada ---------- */
function opcoesHoras(sel){ var h = ''; for (var m = 6 * 60; m <= 23 * 60 + 45; m += 15){ var t = hhmm(m); h += '<option value="' + t + '"' + (t === sel ? ' selected' : '') + '>' + t.replace(':', 'h') + '</option>'; } return h; }
function vHorario(c){
  var hor = JSON.parse(JSON.stringify(cfg.horario)), loc = cfg.local;
  c.innerHTML = '<form class="painel" id="fHor" novalidate><h2>Horário</h2><p class="ajuda-t">Os clientes só veem no site as horas destes dias. Bloqueios e marcações que já existem não mudam.</p>' +
    DIAS.map(function(n, w){ var d = hor.dias[String(w)] || {abre: '10:00', fecha: '18:00'}; var on = !!hor.dias[String(w)];
      return '<div class="dia-h" data-w="' + w + '"><span class="nome" id="dn' + w + '">' + n + '</span><span class="interruptor"><input type="checkbox" aria-labelledby="dn' + w + '"' + (on ? ' checked' : '') + '><span></span></span>' +
        '<div class="horas-d"' + (on ? '' : ' hidden') + '><label>Abre às<select data-k="abre">' + opcoesHoras(d.abre) + '</select></label><label>Fecha às<select data-k="fecha">' + opcoesHoras(d.fecha) + '</select></label></div></div>'; }).join('') +
    '<div class="campo" style="margin-top:16px"><span style="font-weight:600;font-size:14px" id="durT">Cada marcação dura</span><div class="chips" role="group" aria-labelledby="durT">' + cfg.duracoes.map(function(d){ return '<button type="button" data-d="' + d + '" aria-pressed="' + (d === hor.duracao) + '">' + (d < 60 ? d + ' min' : d === 60 ? '1 hora' : d === 90 ? '1h30' : '2 horas') + '</button>'; }).join('') + '</div></div>' +
    '<div class="previa" id="hPrev"></div><p class="erro" id="eHor" hidden></p><div class="barra-guardar"><p id="hEstado">Sem alterações.</p><button class="btn" id="bHor" disabled>Guardar horário</button></div></form>' +
    '<form class="painel" id="fLoc" novalidate><h2>Morada</h2><p class="ajuda-t">Aparece no site, no mapa e nas mensagens prontas (palavra {local}).</p>' +
    '<div class="campo"><label for="lNome">Nome do sítio</label><input id="lNome" maxlength="60" value="' + esc(loc.nome) + '" placeholder="Ex.: Kaos Tattoo"></div>' +
    '<div class="campo"><label for="lRua">Rua e número</label><input id="lRua" maxlength="80" value="' + esc(loc.rua) + '" placeholder="Ex.: Rua da Torrinha, 202" autocomplete="off"></div>' +
    '<div class="duas"><div class="campo"><label for="lCp">Código postal</label><input id="lCp" maxlength="8" inputmode="numeric" value="' + esc(loc.cp) + '" placeholder="4050-610"></div><div class="campo"><label for="lCid">Cidade</label><input id="lCid" maxlength="40" value="' + esc(loc.cidade) + '"></div></div>' +

  var base = JSON.stringify(hor);
  function ler(){
    var dias = {}, dur = +($('[data-d][aria-pressed="true"]', c) || {}).dataset.d || 60, mal = '';
    $$('.dia-h', c).forEach(function(r){ var w = r.dataset.w; if (!$('input', r).checked) return;
      var a = $('[data-k="abre"]', r).value, f = $('[data-k="fecha"]', r).value;
      if (minutos(f) - minutos(a) < dur) mal = DIAS[w] + ': a hora de fecho tem de ficar pelo menos ' + (dur < 60 ? dur + ' minutos' : dur === 60 ? '1 hora' : dur / 60 + ' horas').replace('1.5 horas', '1h30') + ' depois da abertura.';
      dias[w] = {abre: a, fecha: f}; });
    return {dias: dias, duracao: dur, mal: mal};
  }
  function ver(){
    var r = ler(), n = JSON.stringify({dias: r.dias, duracao: r.duracao}) !== base, t = horarioTexto(r);

  }
  $$('.dia-h', c).forEach(function(r){ $('input', r).addEventListener('change', function(){ $('.horas-d', r).hidden = !this.checked; ver(); }); $$('select', r).forEach(function(s){ s.addEventListener('change', ver); }); });

  ver();
  $('#fHor').addEventListener('submit', function(e){
    e.preventDefault(); var r = ler(), b = $('#bHor'); if (r.mal) return;
    b.disabled = true;
    api('POST', '/admin/config/horario', {dias: r.dias, duracao: r.duracao}).then(function(j){ cfg.horario = {dias: j.horario.dias, duracao: j.horario.duracao}; avisarSaida(false); toast('Horário guardado. Já está no site.'); vHorario(c); },
      function(x){ $('#eHor').textContent = erroCampos(x); $('#eHor').hidden = false; b.disabled = false; });

  $('#fLoc').addEventListener('submit', function(e){

      function(x){ er.textContent = erroCampos(x); er.hidden = false; b.disabled = false; });
  });
}

/* reduz a foto no telemóvel antes de enviar (lado maior até d.max, WebP ou JPEG se o browser não fizer WebP) */
function reduzir(file, max, quadrada){
  function desenhar(src, w, h){
    var cx = 0, cy = 0, cw = w, ch = h;
    if (quadrada){ var l = Math.min(w, h); cx = (w - l) / 2; cy = (h - l) / 2; cw = ch = l; }
    var k = Math.min(1, max / Math.max(cw, ch)), cv = document.createElement('canvas');
    cv.width = Math.round(cw * k); cv.height = Math.round(ch * k);
    var g = cv.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(src, cx, cy, cw, ch, 0, 0, cv.width, cv.height);
    return new Promise(function(ok, nao){
      cv.toBlob(function(b){
        if (b && b.type === 'image/webp') return ok(b);
        cv.toBlob(function(j){ j ? ok(j) : nao(new Error('codificar')); }, 'image/jpeg', .85);
      }, 'image/webp', .82);
    });
  }
  if (window.createImageBitmap) return createImageBitmap(file, {imageOrientation: 'from-image'}).then(function(bm){ return desenhar(bm, bm.width, bm.height); }, function(){ return porImagem(); });
  return porImagem();
  function porImagem(){
    return new Promise(function(ok, nao){ var u = URL.createObjectURL(file), im = new Image();
      im.onload = function(){ desenhar(im, im.naturalWidth, im.naturalHeight).then(ok, nao); URL.revokeObjectURL(u); };
      im.onerror = function(){ URL.revokeObjectURL(u); nao(new Error('abrir')); }; im.src = u; });
  }
}
function prepararFoto(k, file, c){

  toast('A preparar a foto…');

    if (blob.size > 3 * 1024 * 1024) return toast('A foto continua muito grande. Escolhe outra.');
    dlgTextos(k, blob, c);
  }, function(){ toast('Não consegui abrir esta foto. Tenta outra (JPG ou PNG).'); });
}

    if (s){
      var serie = s.serie || [], maxV = Math.max.apply(null, serie.map(function(x){ return x.visitantes; }).concat(1));
      html += '<div class="painel"><h2>Pessoas no site por dia</h2><p class="ajuda-t" style="margin:0">' + n0(r.visitas) + ' visitas, ' + (r.tempo_medio_s != null ? r.tempo_medio_s + ' s em média' : 'sem tempo médio') + '. Cada pessoa conta uma vez por dia (sem cookies).</p><div class="grafico" role="img" aria-label="Pessoas por dia">' + serie.map(function(x){ return '<i class="' + (x.visitantes ? '' : 'zero') + '" style="height:' + Math.max(2, x.visitantes / maxV * 100) + '%" title="' + x.quando + ': ' + x.visitantes + '"></i>'; }).join('') + '</div><div class="eixo"><span>' + (serie[0] ? fmtCurto.format(dParse(serie[0].quando)) : '') + '</span><span>hoje</span></div></div>';
      var fontes = (s.fontes || []).slice(0, 6), maxF = Math.max.apply(null, fontes.map(function(x){ return x.visitas; }).concat(1));
      html += '<div class="painel"><h2>De onde vêm</h2>' + (fontes.length ? '<div class="barras-h">' + fontes.map(function(x){ return '<div><span>' + esc(x.fonte === 'Direto' ? 'Direto (link escrito ou guardado)' : x.fonte) + '</span><b>' + n0(x.visitas) + '</b><i style="--w:' + (x.visitas / maxF * 100) + '%"></i></div>'; }).join('') + '</div>' : '<p class="ajuda-t" style="margin:0">Ainda sem visitas neste período.</p>') + '</div>';
      var ac = (s.acoes || []).filter(function(x){ return x.n; });
      html += '<div class="painel"><h2>O que tocam</h2>' + (ac.length ? '<div class="barras-h">' + ac.map(function(x){ return '<div><span>' + esc(NOMES_ACAO[x.nome] || x.nome) + '</span><b>' + n0(x.n) + '</b></div>'; }).join('') + '</div>' : '<p class="ajuda-t" style="margin:0">Ninguém tocou ainda em WhatsApp, telefone ou Instagram neste período.</p>') + '</div>';
    } else html += '<div class="painel"><h2>Pessoas no site</h2><p class="ajuda-t" style="margin:0">As visitas do site não estão disponíveis agora. Os números da agenda acima estão certos.</p></div>';
    var top = n.top, maxT = Math.max.apply(null, top.map(function(x){ return x.n; }).concat(1));
    html += '<div class="painel"><h2>Mais pedidos</h2>' + (top.length ? '<div class="barras-h">' + top.map(function(x){ return '<div><span>' + esc(x.nome) + '</span><b>' + x.n + '</b><i style="--w:' + (x.n / maxT * 100) + '%"></i></div>'; }).join('') + '</div>' : '<p class="ajuda-t" style="margin:0">Ainda sem marcações neste período.</p>') + '</div>';
    var e = n.estados;
    html += '<div class="painel"><h2>Como acabaram as marcações</h2><div class="barras-h"><div><span>Feitas</span><b>' + e.concluida + '</b></div><div><span>Confirmadas (ainda por fazer)</span><b>' + e.confirmada + '</b></div><div><span>À espera de resposta</span><b>' + e.pendente + '</b></div><div><span>Faltou</span><b>' + e.faltou + '</b></div><div><span>Canceladas</span><b>' + e.cancelada + '</b></div><div><span>Recusadas</span><b>' + e.recusada + '</b></div></div>' +
      '<p class="nota-c">Conta as marcações com data nos últimos ' + periodo + ' dias. A faturação é estimada a partir do preço de cada marcação feita.</p></div>';
    $('#num').innerHTML = html;
  }, function(){ $('#num').innerHTML = '<p class="vazio">Não deu para carregar. Toca em «Atualizar».</p>'; });
}

/* ---------- arranque ---------- */
api('GET', '/admin/estado').then(mostrarApp, function(){ mostrarEntrar(); });
})();
</script>
