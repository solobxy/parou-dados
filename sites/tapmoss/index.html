<style>
:root{
  --bg:#0b120d;--pn:rgba(14,22,16,.9);--pn-solid:#121c14;--pn2:#1a281c;--ed:#2b3e2d;--ed2:#41603c;
  --tx:#f2ead2;--tx2:#b8b39b;--tx3:#8d8a77;--moss:#9ad65a;--coin:#f4c54f;--gem:#86e1f5;--water:#71b9ea;--warn:#f0905e;
  --r0:#c9c4ad;--r1:#5fb0f0;--r2:#4fe0b0;--r3:#b685f2;--r4:#f4c54f;--r5:#ff6d8a;
  --f:'Pixelify Sans',ui-monospace,Menlo,Consolas,monospace;
  --notch:polygon(3px 0,calc(100% - 3px) 0,100% 3px,100% calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,0 calc(100% - 3px),0 3px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#060a07;color:var(--tx);font-family:var(--f);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button,select{font:inherit;color:inherit;background:none;border:0;-webkit-appearance:none;appearance:none}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--moss)}
#app{position:relative;height:100vh;height:100dvh;max-width:480px;margin:0 auto;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.pn{background:var(--pn);border:2px solid var(--ed);clip-path:var(--notch)}
.pxi{display:block;width:18px;height:18px;flex:none}
.hidden{display:none!important}
/* pixel numbers */
.nm{display:inline-flex;align-items:center;line-height:0;vertical-align:middle}
.nm svg{display:block;height:1em}
.nm.big{font-size:22px}.nm.mid{font-size:17px}.nm.sm{font-size:14px}.nm.xs{font-size:12px}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;z-index:5;padding:8px 10px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#hud .row>*,#hud .chips>*,#boss{pointer-events:auto}
#boss{display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 4px 0;cursor:pointer}
.bt{font-size:15px;font-weight:600;color:#fff;text-shadow:2px 2px 0 #2b2b2b;display:flex;align-items:center;gap:6px;letter-spacing:.02em;white-space:nowrap;max-width:100%;overflow:hidden}
.bt .nm{--nsh:#2b2b2b;color:#fff;font-size:14px}
.bt span.sc{color:#e8f5cf;overflow:hidden;text-overflow:ellipsis}
.bb{position:relative;width:100%;height:10px;background:#1b2a17;box-shadow:0 0 0 2px #0a0f0a,inset 0 2px 0 rgba(0,0,0,.35)}
.bb i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#c7f08a 0 2px,#8fd14a 2px 7px,#5e9d32 7px);transition:width .4s ease-out}
.bb::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 calc(5% - 2px),rgba(8,14,8,.75) calc(5% - 2px) 5%)}
#hud .row{display:flex;gap:6px;align-items:stretch}
.pill{height:42px;display:flex;align-items:center;gap:7px;padding:0 10px;line-height:1}
.pill .stack{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
#coinP{flex:1;min-width:0;color:#ffe9a0;--nsh:#3a2706}
#coinP .cps{color:var(--tx2);--nsh:#0b120d}
#gemP{color:#c9f4ff;--nsh:#0f3a48}
.ib{width:42px;height:42px;display:grid;place-items:center;position:relative;flex:none}
.ib .pxi{width:20px;height:20px}
.dot{position:absolute;top:5px;right:5px;width:8px;height:8px;background:var(--warn);box-shadow:0 0 0 2px #121c14;display:none}
.badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 3px;background:var(--warn);color:#1a0d06;display:none;place-items:center;font-size:11px;font-weight:700;--nsh:transparent}
.has-dot .dot{display:block}.has-badge .badge{display:grid}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 9px;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--tx2);white-space:nowrap}
.chip .pxi{width:14px;height:14px}
.chip b{color:var(--tx);font-weight:500}
.chip.good b{color:var(--moss)}

/* dock */
#dock{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.db{position:relative;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px;color:var(--tx)}
.db .pxi{width:24px;height:24px}
.db:active{background:var(--pn2)}
.db .cd{position:absolute;left:8px;right:8px;bottom:5px;height:3px;background:#0a100b;display:none}
.db .cd i{display:block;height:100%;width:0;background:var(--water)}
.db.cool .cd{display:block}
.db.on .lb{color:var(--water)}
.db.cool{color:var(--tx2)}

/* fx */
#fx{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.ft{position:absolute;font-size:20px;color:#ffe48a;--nsh:#3a2706;white-space:nowrap;animation:ft .95s cubic-bezier(.2,.7,.3,1) forwards}
.ft.gem{color:#bff2ff;--nsh:#0f3a48}
@keyframes ft{0%{opacity:0;transform:translate(-50%,-40%) scale(.85)}18%{opacity:1;transform:translate(-50%,-75%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
@keyframes ftr{0%{opacity:0;transform:translate(-50%,-80%)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
#hint{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;padding:10px 14px;font-size:15px;text-align:center;line-height:1.35;animation:bob 1.8s ease-in-out infinite;width:max-content;max-width:86%}
@keyframes bob{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,calc(-50% - 4px))}}
#toast{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;transform:translate(-50%,-6px);opacity:0;transition:opacity .2s ease-out,transform .2s ease-out;pointer-events:none;
  padding:10px 14px;font-size:15px;line-height:1.3;text-align:center;width:max-content;max-width:88%}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.lvl{border-color:var(--ed2);color:#e9f7c9}

/* sheet */
#scrim{position:absolute;inset:0;z-index:19;background:rgba(3,6,4,.5);opacity:0;pointer-events:none;transition:opacity .2s ease-out}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;max-height:80%;display:flex;flex-direction:column;background:var(--pn-solid);border-top:2px solid var(--ed);
  transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.open{transform:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 6px 16px;flex:none}
.sh-head h2{font-size:22px;font-weight:600;letter-spacing:.01em}
.sh-x{width:44px;height:44px;display:grid;place-items:center}
.sh-x .pxi{width:16px;height:16px}
.sh-body{overflow:auto;padding:2px 14px 22px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.lead{font-size:14px;line-height:1.45;color:var(--tx2);margin:0 2px 12px}
.sub{font-size:13px;font-weight:500;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin:16px 2px 8px}
.sub:first-child{margin-top:4px}
.item{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;background:#18241a;margin-bottom:8px;clip-path:var(--notch);width:100%;text-align:left}
.item .meta{flex:1;min-width:0}
.item h3{font-size:16px;font-weight:600;line-height:1.2}
.item p{font-size:13px;line-height:1.35;color:var(--tx2);margin-top:3px}
.item .ico{width:40px;height:40px;display:grid;place-items:center;background:#0f1810;flex:none;clip-path:var(--notch)}
.item .ico .pxi{width:26px;height:26px}
.item.sel{background:#1f3320;box-shadow:inset 0 0 0 2px var(--ed2)}
.item.lock{opacity:.6}
.tag{font-size:13px;color:var(--tx2);white-space:nowrap}
.lv{font-size:12px;color:var(--tx3);font-weight:500}
.item.sel .tag{color:var(--moss)}
.sw{display:flex;flex:none;clip-path:var(--notch)}
.sw i{display:block;width:7px;height:40px}
.btn{min-width:84px;height:44px;padding:0 11px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600;color:#f6f0dc;flex:none;
  background:#356126;box-shadow:inset 0 -3px 0 #1d3a14,inset 0 2px 0 #4f8a35;clip-path:var(--notch);--nsh:#1d3a14}
.btn .nm{color:#fff6d8}
.btn:active{box-shadow:inset 0 -1px 0 #1d3a14,inset 0 2px 0 #4f8a35;transform:translateY(1px)}
.btn:disabled{background:#262f26;color:#8b9081;box-shadow:inset 0 -3px 0 #191f19;transform:none;--nsh:#111}
.btn:disabled .nm{color:#9a9f90}
.btn.gem{background:#1f5a6c;box-shadow:inset 0 -3px 0 #123744,inset 0 2px 0 #3c8aa5;--nsh:#0d2c36}
.btn.gem:disabled{background:#262f26;box-shadow:inset 0 -3px 0 #191f19}
.btn.ghost{background:#202b21;box-shadow:inset 0 -3px 0 #141b14,inset 0 2px 0 #2f3f30}
.btn.danger{background:#6a2a22;box-shadow:inset 0 -3px 0 #3d1612,inset 0 2px 0 #8d4033}
.btn.gold{background:#8a5f12;box-shadow:inset 0 -3px 0 #4f350a,inset 0 2px 0 #c08a2a;--nsh:#3a2706}
.btn .pxi{width:16px;height:16px}
.btn.wide{width:100%;height:50px;font-size:17px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:#18241a;clip-path:var(--notch);padding:9px 4px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:inset 0 -3px 0 var(--rc,transparent)}
.card .pxi{width:30px;height:30px}
.card h3{font-size:12px;font-weight:600;line-height:1.15}
.card p{font-size:11px;color:var(--tx2);line-height:1.25}
.card .nm{color:var(--moss);--nsh:#0b120d}
.card.off{box-shadow:none}
.card.off h3{color:var(--tx3)}
.rh{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 8px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.rh small{font-weight:500;color:var(--tx3);text-transform:none;letter-spacing:0;font-size:12px}
.bonus{background:#152016;clip-path:var(--notch);padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:6px}
.bonus b{font-size:20px;color:var(--moss)}
.bonus p{font-size:13px;color:var(--tx2);line-height:1.35}
.zbar{height:8px;background:#0a100b;box-shadow:0 0 0 1px #233325;margin-top:8px}
.zbar i{display:block;height:100%;background:linear-gradient(90deg,#4c8a2c,#9ad65a)}
.track{display:flex;gap:6px;justify-content:center;margin:12px 0 6px}
.track i{width:30px;height:30px;display:grid;place-items:center;font-style:normal;color:var(--tx3);background:#0f1810;clip-path:var(--notch);--nsh:transparent}
.track i.done{background:#2f5a22;color:#e9f7c9}
.track i.big{background:#1f5a6c;color:#d8f6ff}
.track i.done.big{background:#2f7a8f}
.chestcard{background:#18241a;clip-path:var(--notch);padding:14px 12px;margin-bottom:10px}
.chestcard.daily{background:linear-gradient(#2a2312,#18241a 70%)}
.chestcard h3{font-size:18px;font-weight:600}
.chestcard p{font-size:13px;color:var(--tx2);line-height:1.4;margin-top:4px}
.chestrow{display:flex;align-items:center;gap:14px}
.chestrow .big{width:74px;height:66px;flex:none;display:grid;place-items:center}
.chestrow .big .pxi{width:72px;height:64px}
.ready .big .pxi{animation:wob 1.6s ease-in-out infinite}
@keyframes wob{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-5deg)}82%{transform:rotate(5deg)}88%{transform:rotate(-3deg)}94%{transform:rotate(2deg)}}
.chestbtns{display:flex;gap:8px;margin-top:12px}
.chestbtns .btn{flex:1}
.reveal{background:#0f1810;clip-path:var(--notch);padding:14px 12px;margin-bottom:10px;text-align:center;box-shadow:inset 0 0 0 2px var(--rc,#2b3e2d);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
.reveal .it{display:grid;place-items:center;margin:4px auto 8px;width:64px;height:64px;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 35%,transparent) 0 40%,transparent 70%)}
.reveal .it .pxi{width:48px;height:48px}
.reveal .rn{font-size:13px;font-weight:600;color:var(--rc);text-transform:uppercase;letter-spacing:.1em}
.reveal h3{font-size:19px;font-weight:600;margin:3px 0}
.reveal p{font-size:13px;color:var(--tx2);line-height:1.4}
.reveal .gain{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:8px;color:#ffe48a;--nsh:#3a2706}
.reveal .gain .g{color:#bff2ff;--nsh:#0f3a48}
.reveal .gain span{display:flex;align-items:center;gap:5px}
.many{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.many span{width:40px;height:40px;display:grid;place-items:center;background:#18241a;clip-path:var(--notch);box-shadow:inset 0 -3px 0 var(--rc)}
.many span .pxi{width:26px;height:26px}
.center{text-align:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .btn{min-width:0}
select.sel{width:100%;height:48px;padding:0 12px;background:#18241a;clip-path:var(--notch);font-size:16px;color:var(--tx)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px;background:#18241a;clip-path:var(--notch);text-align:left;font-size:15px}
.tog .sw2{width:44px;height:24px;background:#0a100b;box-shadow:0 0 0 2px #2b3e2d;position:relative;flex:none}
.tog .sw2::after{content:"";position:absolute;top:4px;left:4px;width:16px;height:16px;background:#5a6658;transition:left .15s}
.tog[aria-checked="true"] .sw2::after{left:24px;background:var(--moss)}
.note{font-size:13px;color:var(--tx2);line-height:1.45;margin:8px 2px}
.credit{font-size:13px;color:var(--tx3);text-align:center;margin-top:22px;letter-spacing:.04em}
.credit a,.t-credit a{color:var(--moss);text-decoration:none;font-weight:600;padding:6px 2px}.credit a:focus-visible,.t-credit a:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
.confirm{background:#2a1a17;clip-path:var(--notch);padding:12px;margin-top:8px}
.confirm p{font-size:14px;margin-bottom:10px;line-height:1.4}
.scard{display:flex;gap:12px;align-items:center;padding:12px;background:#18241a;clip-path:var(--notch);margin-bottom:8px}
.scard.cur{background:#1f3320;box-shadow:inset 0 0 0 2px var(--ed2)}
.scard .ico{width:48px;height:48px;display:grid;place-items:center;background:#0f1810;clip-path:var(--notch);flex:none}
.scard .ico .pxi{width:32px;height:32px}
.scard h3{font-size:16px;font-weight:600}
.scard p{font-size:13px;color:var(--tx2);line-height:1.35;margin-top:3px}
.scard .meta{flex:1;min-width:0}
.scard .inc{display:flex;align-items:center;gap:6px;margin-top:5px;color:#ffe48a;--nsh:#3a2706}
.scard.lock{opacity:.75}

/* side chests */
#side{position:absolute;right:10px;top:calc(100% + 8px);display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.sbtn{width:64px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;background:none;border:0;padding:0;cursor:pointer}
.sbtn .pxi{width:54px;height:48px;filter:drop-shadow(0 3px 0 rgba(4,8,5,.55)) drop-shadow(0 0 1px rgba(4,8,5,.9));transition:transform .15s}
.sbtn:active .pxi{transform:scale(.92)}
.sbtn .nm{color:var(--tx);--nsh:#05080a;min-height:12px;filter:drop-shadow(0 1px 0 #05080a)}
.sbtn.ready .pxi{filter:drop-shadow(0 3px 0 rgba(4,8,5,.55)) drop-shadow(0 0 1px rgba(4,8,5,.9)) drop-shadow(0 0 9px rgba(244,197,79,.6));animation:wob 2.4s ease-in-out infinite}
.sbtn.lvl.ready .pxi{filter:drop-shadow(0 3px 0 rgba(4,8,5,.55)) drop-shadow(0 0 1px rgba(4,8,5,.9)) drop-shadow(0 0 7px rgba(230,222,190,.4))}
.sbtn .badge{top:2px;right:0}
.sbtn:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
/* modal */
#modal{position:absolute;inset:0;z-index:26;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(3,6,4,.62)}
.mcard{width:100%;max-width:360px;background:var(--pn-solid);border:2px solid var(--ed);clip-path:var(--notch);padding:12px}
.mcard .reveal{margin-bottom:0}
.mbtns{display:flex;gap:8px;margin-top:10px}.mbtns .btn{flex:1}
/* placement */
#place{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:22;padding:12px}
#place p{font-size:15px;line-height:1.35;margin-bottom:10px;text-align:center}
.placing #dock,.placing #side{display:none}
.placing #toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.visiting #toast{bottom:calc(132px + env(safe-area-inset-bottom,0px))}
/* profile & achievements */
.prof{background:#152016;clip-path:var(--notch);padding:14px;margin-bottom:6px}
.prof h3{font-size:22px;font-weight:600;word-break:break-word}
.prof p{font-size:13px;color:var(--tx2);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.stats div{background:#0f1810;clip-path:var(--notch);padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px}
.stats .nm{color:var(--moss);--nsh:#0b120d}
.stats span{font-size:11px;color:var(--tx3)}
.ach{display:flex;gap:12px;align-items:center;padding:10px 10px 10px 12px;background:#18241a;clip-path:var(--notch);margin-bottom:8px}
.ach .meta{flex:1;min-width:0}
.ach h3{font-size:15px;font-weight:600}
.ach p{font-size:12px;color:var(--tx2);margin-top:2px}
.ach .pb{height:6px;background:#0a100b;margin-top:7px;box-shadow:0 0 0 1px #233325}
.ach .pb i{display:block;height:100%;background:var(--moss)}
.ach.claim{background:#2a2312;box-shadow:inset 0 0 0 2px #7a5a18}
.ach.done{opacity:.62}
.ach .rw{display:flex;align-items:center;gap:4px;color:#c9f4ff;--nsh:#0f3a48}
.ach .ico{width:36px;height:36px;display:grid;place-items:center;background:#0f1810;flex:none;clip-path:var(--notch)}
.ach .ico .pxi{width:22px;height:22px}
.ach.todo .ico .pxi{filter:grayscale(1) brightness(.6)}
.inp{width:100%;max-width:340px;height:52px;padding:0 14px;background:#18241a;border:2px solid var(--ed);clip-path:var(--notch);font:inherit;font-size:19px;color:var(--tx);text-align:center;-webkit-user-select:text;user-select:text}
.inp:focus{outline:none;border-color:var(--moss)}
.visiting #dock,.visiting #side,.visiting #photoB~#boostC{display:none}
#visitBar{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:22;padding:10px}
.vbt{display:flex;gap:10px;align-items:center;margin-bottom:10px}.vbav{width:34px;height:44px;flex:none;display:grid;place-items:center;background:#0f1810;clip-path:var(--notch)}.vbav .pxi{width:26px;height:auto}
.vbm b{font-size:16px;font-weight:600;display:block}.vbm p{font-size:12px;color:var(--tx2);margin-top:2px}
.row3{display:flex;gap:6px}.row3 .btn{flex:1;padding:0 6px;font-size:14px;gap:5px}.row3 .btn .pxi{width:16px;height:16px}
.photo #hud,.photo #dock,.photo #side,.photo #hint,.photo #toast,.photo #visitBar{display:none!important}
#photoBar{position:absolute;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:22;display:flex;gap:8px}#photoBar .btn{flex:1}
#flash{position:absolute;inset:0;z-index:40;background:#fff;opacity:0;pointer-events:none}#flash.on{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.phprev{background:#0a100b;clip-path:var(--notch);padding:6px;display:grid;place-items:center}.phprev img{display:block;max-width:100%;max-height:58vh;image-rendering:pixelated;image-rendering:crisp-edges}
.mbtns a.btn{text-decoration:none;display:flex;align-items:center;justify-content:center}
.chip.ic{width:34px;padding:0;justify-content:center}.chip.ic .pxi{width:18px;height:14px}
.tabs{display:flex;gap:4px;margin:-2px 0 12px;background:#0f1810;clip-path:var(--notch);padding:4px}
.tabs button{flex:1;height:38px;font-size:14px;color:var(--tx2);clip-path:var(--notch);position:relative}
.tabs button.on{background:#2b3d1f;color:var(--tx);box-shadow:inset 0 0 0 2px var(--moss)}
.tabs .dot{position:absolute;top:6px;right:8px}
.fr{display:flex;gap:10px;align-items:center;padding:8px 8px 8px 10px;background:#18241a;clip-path:var(--notch);margin-bottom:8px;cursor:pointer}
.fr .fav{width:34px;height:44px;flex:none;display:grid;place-items:center;background:#0f1810;clip-path:var(--notch)}.fr .fav .pxi{width:26px;height:auto}
.fr .meta{flex:1;min-width:0}.fr h3{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fr p{font-size:12px;color:var(--tx2);margin-top:2px}
.fr .btn{padding:0 12px;height:40px;font-size:14px}.fr .ib2{width:40px;padding:0}.fr .ib2 .pxi{width:18px;height:16px}.frok{width:40px;display:grid;place-items:center}.frok .pxi{width:16px;height:14px}
.code{display:flex;align-items:center;gap:10px;padding:12px;background:#152016;clip-path:var(--notch);margin-bottom:8px}
.code .meta{flex:1}.code p{font-size:12px;color:var(--tx2)}.code .cd{font-size:26px;letter-spacing:.12em;color:var(--moss);font-weight:700}
.addfr{display:flex;gap:6px;margin-bottom:6px}.addfr .inp{flex:1;height:46px;font-size:17px;max-width:none;text-transform:uppercase;letter-spacing:.08em}
.gl{list-style:none;text-align:left;margin:8px 0}.gl li{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tx2);padding:4px 0}.gl li .pxi{width:16px;height:16px;flex:none}.gl b{color:var(--tx)}
.globe{display:grid;place-items:center;padding:6px 0 4px;background:radial-gradient(circle at 50% 50%,#132033,#060a0d 72%);clip-path:var(--notch)}
.globe canvas{width:min(78vw,300px);height:auto;aspect-ratio:1;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}
#globeInfo{display:flex;flex-direction:column;gap:3px;text-align:center;padding:10px 4px 2px;min-height:52px}#globeInfo b{font-size:17px}#globeInfo span{font-size:13px;color:var(--tx2)}
.rank{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#18241a;clip-path:var(--notch);margin-bottom:6px;font-size:14px}
.rank.me{box-shadow:inset 0 0 0 2px #7a5a18}.rank .n{width:26px;color:var(--tx3)}.rank .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rank .m{color:var(--moss);min-width:64px;text-align:right}.rank .j{color:var(--tx3);font-size:12px}
.evcard{padding:14px;background:#1e1a10;clip-path:var(--notch);box-shadow:inset 0 0 0 2px #5a4618;margin-bottom:10px}
.evcard .row{display:flex;gap:12px;align-items:center}.evcard .big{width:56px;height:56px;display:grid;place-items:center;flex:none}.evcard .big .pxi{width:48px;height:48px}
.evcard h3{font-size:19px;font-weight:600}.evcard p{font-size:13px;color:var(--tx2);margin-top:3px}
.evbar{height:10px;background:#0a100b;margin:12px 0 4px;box-shadow:0 0 0 1px #3a3320}.evbar i{display:block;height:100%;background:linear-gradient(90deg,#c9921e,#f4c54f)}
.metas{display:flex;flex-direction:column;gap:6px;margin-top:10px}.metas div{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:8px 10px;background:#141c12;clip-path:var(--notch)}.metas .ok{color:var(--moss)}
.sbtn.ev .pxi{width:42px;height:42px}
.pfrow{display:flex;gap:14px;align-items:center}
.pav{width:68px;height:88px;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 50% 72%,#2a3a22,#0f1810 72%);clip-path:var(--notch)}
.pav .pxi{width:46px;height:auto}
.pmeta{min-width:0}
.avprev{display:grid;place-items:center;height:156px;margin:0 0 4px;background:radial-gradient(ellipse at 50% 82%,#2f4526,#0f1810 70%);clip-path:var(--notch)}
.avprev .pxi{height:128px;width:auto}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ch{min-height:40px;padding:4px 12px;background:#18241a;clip-path:var(--notch);font-size:14px;color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.ch small{font-size:10.5px;color:var(--tx3)}
.ch.on{background:#2b3d1f;box-shadow:inset 0 0 0 2px var(--moss)}
.ch:disabled{opacity:.5}
.swb{width:40px;height:40px;background:var(--c);clip-path:var(--notch);display:grid;place-items:center;--nsh:#000}
.swb.on{box-shadow:inset 0 0 0 3px #f3efe2,inset 0 0 0 5px rgba(0,0,0,.45)}
.swb:disabled{opacity:.4}.swb .nm{color:#fff}
.tog.trait{margin-bottom:6px}.tog.trait.on{box-shadow:inset 0 0 0 2px var(--moss)}.tog.trait .pxi{width:20px;height:18px;flex:none}
[data-snd]{margin-bottom:6px}
.lnk{display:block;margin:12px auto 0;font-size:14px;color:var(--tx2);text-decoration:underline;text-underline-offset:3px;padding:6px}
.err{font-size:13px;color:var(--warn);margin:8px 0 6px;min-height:18px;text-align:center}
/* title */
#title{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  padding:0 18px calc(18px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to bottom,rgba(5,9,6,0) 26%,rgba(5,9,6,.55) 52%,rgba(5,9,6,.93) 100%);transition:opacity .4s ease-out}
#title.gone{opacity:0;pointer-events:none}
.titling #hud,.titling #dock{opacity:0;pointer-events:none}
#hud,#dock{transition:opacity .4s ease-out}
.logo{font-size:66px;font-weight:700;line-height:1;letter-spacing:.01em;color:#f2ead2;text-shadow:0 4px 0 #3b3524,0 8px 0 #141a12}
.logo span{color:#a8dc5c;text-shadow:0 4px 0 #2c5c1d,0 8px 0 #12240d}
.tag-l{font-size:15px;color:var(--tx2);margin:14px 0 4px;text-align:center}
.scn{font-size:14px;color:#cfe8a8;margin-bottom:16px;text-align:center}
.away{font-size:15px;line-height:1.5;text-align:center;margin:0 0 16px;padding:10px 14px;max-width:100%}
.away b{color:#ffe48a;font-weight:600}
.q{font-size:17px;font-weight:600;margin:4px 0 10px}
.cities{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;width:100%;max-width:360px}
.cities button,.cities select{min-height:46px;padding:4px 6px;font-size:15px;line-height:1.15;background:#18241a;clip-path:var(--notch);border:0;color:var(--tx);text-align:center;text-align-last:center}
.cities button:active{background:#2f5a22}
.qhint{font-size:13px;color:var(--tx2);text-align:center;margin:2px 0 14px;max-width:320px;line-height:1.4}
.start{width:100%;max-width:340px;height:54px;font-size:19px;font-weight:600}
.t-credit{font-size:13px;color:var(--tx3);margin-top:14px;letter-spacing:.04em;pointer-events:auto}

/* reduced motion */
.rm .ft{animation:ftr .95s ease-out forwards}
.rm #hint,.rm .ready .big .pxi,.rm .reveal,.rm .sbtn.ready .pxi{animation:none}
.rm #sheet,.rm #toast,.rm #title,.rm #scrim,.rm .bb i{transition:none}

  .ft{animation:ftr .95s ease-out forwards}
  #hint,.ready .big .pxi,.reveal,.sbtn.ready .pxi{animation:none}
  #sheet,#toast,#title,#scrim,.bb i{transition:none}
}
@media (max-width:350px){
  #hud{padding:6px 8px 0}#hud .row{gap:4px}
  .pill{padding:0 7px;gap:5px}.nm.big{font-size:19px}

  .db{font-size:11px}.btn{min-width:72px;padding:0 8px}
  .item{gap:10px}.item .ico{width:34px;height:34px}
  .grid4{gap:4px}
}

      <span class="pn chip hidden" id="boostC"></span>

function sunPos(date,lat,lon){
  const rad=Math.PI/180,d=date.getTime()/864e5-10957.5;

// compose a pose into {map,pal} on a 14x20 canvas; foot at row 19, body frame at (3,8)
function avCompose(look,pose,o){
  o=o||{};const key=JSON.stringify(look)+pose+(o.blink?1:0)+(o.noHat?1:0)+(o.umb?1:0);if(avCache.has(key))return avCache.get(key);
  const P=AVP[pose],GW=16,GH=20,BX=3,BY=8,g=[];for(let y=0;y<GH;y++)g.push(new Array(GW).fill('.'));
  const set=(x,y,ch,under)=>{if(x<0||y<0||x>=GW||y>=GH)return;if(under&&g[y][x]!=='.')return;g[y][x]=ch};
  const v=P.v,hx=BX+1,hy=BY+P.hy;
  // cape behind

  if(look.acc==='mochila'&&v==='s'){for(let dy=6;dy<=8;dy++){set(BX+0,BY+P.hy+dy,'U');set(BX+1,BY+P.hy+dy,dy===7?'u':'U')}}
  if(look.top==='capuz'&&v!=='l'){const c=v==='s'?[[-1,2],[-1,3],[-1,4],[0,5]]:[[-1,2],[-1,3],[-1,4],[6,2],[6,3],[6,4]];for(const[dx,dy]of c)set(hx+dx,hy+dy,'T',true)}
  for(let y=0;y<P.m.length;y++){const row=P.m[y];for(let x=0;x<row.length;x++){const ch=row[x];if(ch!=='.')set(BX+x,BY+y,ch)}}
  if(v!=='l'){
    for(const[dx,dy]of AVO.hair[look.hair][v==='s'?'s':'f']){const x=hx+dx,y=hy+dy;if(g[y]&&(g[y][x]==='.'||g[y][x]==='T'||g[y][x]==='t'||g[y][x]==='S'||g[y][x]==='K'))set(x,y,'H')}
    // tops
    if(look.top==='riscas'){for(let y=hy+6;y<=hy+8;y+=2)for(let x=0;x<GW;x++)if(g[y][x]==='T'||g[y][x]==='t')g[y][x]='r'}
    if(look.top==='jardineiras'){for(let y=hy+7;y<=hy+8;y++)for(let x=0;x<GW;x++)if(g[y][x]==='T'||g[y][x]==='t')g[y][x]='P';const sx=v==='s'?[hx+2]:[hx+1,hx+4];for(const x of sx){if(g[hy+6][x]==='T'||g[hy+6][x]==='t')g[hy+6][x]='P';if(g[hy+5][x]==='T'||g[hy+5][x]==='t')g[hy+5][x]='p'}}
    if(look.top==='capuz'){const x=v==='s'?hx+3:hx+2;if(g[hy+6]&&g[hy+6][x]==='T')g[hy+6][x]='r';if(v!=='s'&&g[hy+6][hx+3]==='T')g[hy+6][hx+3]='r'}
    if(look.acc==='cachecol'){for(let x=0;x<GW;x++)if(g[hy+5][x]==='T'||g[hy+5][x]==='t')g[hy+5][x]='C';if(v==='s'){set(hx+1,hy+6,'C');set(hx,hy+6,'c');set(hx-1,hy+7,'c',true)}else{set(hx+4,hy+6,'C');set(hx+4,hy+7,'c')}}
    if(look.acc==='mochila'&&v!=='s'){for(const x of[hx+1,hx+4]){for(const y of[hy+6,hy+7])if(g[y][x]==='T'||g[y][x]==='t'||g[y][x]==='r'||g[y][x]==='P')g[y][x]='u'}}
    if(look.acc==='oculos'){const ey=hy+3,c=v==='s'?[[hx+3,ey],[hx+4,ey],[hx+5,ey],[hx+2,ey]]:[[hx+1,ey],[hx+2,ey],[hx+3,ey],[hx+4,ey]];for(const[x,y]of c)if(g[y]&&g[y][x]!=='.')g[y][x]='G';if(v!=='s')g[ey][hx+2]='g';else g[ey][hx+3]='g'}
    if(look.hat!=='nada'&&!o.noHat){const hh=AVO.hat[look.hat][v==='s'?'s':'f'];const[dx,dy0,rows]=hh;rows.forEach((row,ry)=>{for(let x=0;x<row.length;x++){const ch=row[x];if(ch!=='.')set(hx+dx+x,hy+dy0+ry,'#'+ch)}});
      // hats hide spiky/bun hair on top
      for(let y=0;y<hy;y++)for(let x=0;x<GW;x++)if(g[y][x]==='H')g[y][x]='.'}
    if(o.umb){const L=['....LLLL....','..LLLLLLLL..','.LLlLLLLlLL.','LL..l..l..LL','.....s......','.....s......'];const ux=hx+(v==='s'?-3:-3),uy=hy-6;L.forEach((row,ry)=>{for(let x=0;x<row.length;x++)if(row[x]!=='.')set(ux+x,uy+ry,row[x],row[x]==='s')})}
  }
  if(o.blink)for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)if(g[y][x]==='E')g[y][x]=v==='l'?'e':'e';
  if(v==='l'&&!o.awake)for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)if(g[y][x]==='E')g[y][x]='e';

  const sk=AVSKIN[look.skin]||AVSKIN[0],hp=HATPAL[look.hat]||{};
  const pal={H:look.hc,h:shadeHex(look.hc,.78),S:sk[0],s:sk[1],E:'#1b1512',e:shadeHex(sk[1],.82),K:'#e8907a',T:look.tc,t:shadeHex(look.tc,.8),r:'#efe4c8',P:look.pc,p:shadeHex(look.pc,.75),O:'#2e2420',
    B:'#8a3a2a',b:'#f3ead2',F:'#c9a060',W:'#7a8a92',w:'#4a5a62',L:'#4f8a34',l:'#2f5e24',C:'#d23a4e',c:'#a0283a',G:'#1b1512',g:'#3a4a5a',U:'#a06a3a',u:'#6a4424',V:'#a0283a',v:'#701a28',k:'rgba(16,14,10,.82)'};
  for(const ch in hp)pal['#'+ch]=hp[ch];
  const map=out.map(r=>r.join(''));
  // single-char palette (pxsvg & canvas use one char per pixel)
  const remap={},keys='abcdefgijmnoqxyzABCDFIJMNQRXYZ0123456789';let ki=0;
  const fmap=map.map(row=>{let s='',i=0;while(i<row.length){let ch=row[i];if(ch==='#'){ch=row.slice(i,i+2);i+=2}else i++;if(ch.length>1){if(!remap[ch])remap[ch]='_'+ki++;s+=String.fromCharCode(0x100+parseInt(remap[ch].slice(1)))}else s+=ch}return s});
  for(const k in remap)pal[String.fromCharCode(0x100+parseInt(remap[k].slice(1)))]=pal[k];

  avCache.set(key,res);if(avCache.size>160)avCache.delete(avCache.keys().next().value);return res;
}

function avPortrait(look,cls){

/* ============ location & real weather ============ */
let geoMsg='';
function useGeo(){
  if(!navigator.geolocation){geoMsg='Este navegador não dá a localização.';sheetSig='';renderSheet();return}
  geoMsg='A ver onde estás…';sheetSig='';renderSheet();
  navigator.geolocation.getCurrentPosition(pos=>{
    const la=pos.coords.latitude,lo=pos.coords.longitude,R=6371,rad=Math.PI/180;
    let best=null,bd=1e9;for(const c of CITIES){const dLa=(c.lat-la)*rad,dLo=(c.lon-lo)*rad,a=Math.sin(dLa/2)**2+Math.cos(la*rad)*Math.cos(c.lat*rad)*Math.sin(dLo/2)**2,d=2*R*Math.asin(Math.sqrt(a));if(d<bd){bd=d;best=c}}
    if(bd<120){S.city=best.id;S.loc=null}else S.loc={lat:Math.round(la*10)/10,lon:Math.round(lo*10)/10,nome:'A tua zona',wet:best?best.wet:.8};
    LIVE.wx=null;dirtySave=true;geoMsg='';refreshEnv(true);hud();sheetSig='';renderSheet();toast('Agora segues o dia e o tempo de '+here().nome+'.');fetchWx();saveLocal();
  },()=>{geoMsg='Não deu para ver a localização. Confirma se o navegador tem permissão.';sheetSig='';renderSheet()},{timeout:12000,maximumAge:36e5});
}
let wxBusy=false,wxAt=-1e9;
async function fetchWx(){
  if(wxBusy||!navigator.onLine||window.claude||location.protocol!=='https:')return;wxBusy=true;wxAt=performance.now();
  try{const c=here(),r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=weather_code,cloud_cover`,{cache:'no-store'});
    if(r.ok){const j=await r.json(),wc=j.current.weather_code,cc=j.current.cloud_cover;
      const wx=(wc>=51&&wc<=67)||(wc>=80&&wc<=82)||wc>=95?'rain':(wc>=71&&wc<=77)||wc===85||wc===86||wc===45||wc===48||wc===3||cc>65?'cloudy':'clear';
      LIVE.wx=wx;LIVE.k=c.lat+','+c.lon;LIVE.t=now();refreshEnv();hud()}}catch(e){}
  wxBusy=false;
}

  const ready=chestReady(),st=S.chest.streak%7,cont=isYesterday(S.chest.last),dayN=ready?(cont?st:0):(st===0&&S.chest.streak>0?7:st),nextDay=ready?(cont?S.chest.streak+1:1):0;
  let h=`<div class="chestcard daily ${ready?'ready':''}"><div class="chestrow"><div class="big">${icon(ready?'chestGold':'chestOpen')}</div><div><h3>Baú do dia</h3><p>${ready?(nextDay%7===0?'Sétimo dia seguido: vem pelo menos um achado épico e muitas gemas.':'Moedas de meia hora, gemas e um achado raro ou melhor.'):'Já abriste o de hoje. Volta amanhã para manter a sequência.'}</p></div></div>`;

  cur:0,scenes:[newSceneData('clareira')],waterUntil:0,waterReady:0,boostUntil:0,wishAt:0,rm:false,started:false,fresh:true,tSave:now(),newSp:false,newScn:false,colNew:false}}

function normalize(o){
  if(o.v===1){migrated=true;const d=defaults(o.city||guessCity());d.scenes[0].seed=o.seed||d.scenes[0].seed;d.rm=!!o.rm;d.started=true;d.fresh=false;return d}

function simulateGrowth(sec,withCoins){
  sec=Math.min(sec,(8+S.up.book)*3600);if(sec<20)return null;
  calcIncome();const c0=cps,m0=mossCount,l0=S.level;xpQuiet=true;lvlUps=0;
  let steps=0,rem=sec;const MAX=2500000;while(rem>0&&steps<MAX){const ch=Math.min(rem,20),n=Math.min(Math.floor(growthRate()*ch/3.3),MAX-steps);for(let i=0;i<n;i++)growStep(true);steps+=n;rem-=ch}
  xpQuiet=false;calcIncome();
  let coins=0;if(withCoins){coins=Math.round((c0+cps)/2*sec*(.4+.06*S.up.book));S.coins+=coins}
  const sd=SC();const nd=Math.min(4-sd.debris.length,Math.floor(sec/300));for(let i=0;i<nd;i++)spawnDebris();
  if(S.level>=2){const nf=Math.min(Math.max(0,(5+Math.floor(S.level/4))-sd.flowers.length),Math.floor(sec/200));for(let i=0;i<nf;i++)spawnFlower()}
  return{coins,grown:mossCount-m0,lv:S.level-l0,sec};
}

function openDaily(){
  if(!chestReady())return null;const t=now();
  S.chest.streak=isYesterday(S.chest.last)?S.chest.streak+1:1;S.chest.last=dayKey(t);S.stats.bestStreak=Math.max(S.stats.bestStreak||0,S.chest.streak);
  const d7=S.chest.streak%7===0,mult=1+.15*Math.min(S.chest.streak-1,6);
  const coins=Math.round(Math.max(800,cps*1800)*mult),gems=(d7?25:6+Math.min(S.chest.streak,6));
  const r=rollRarity(luckBase()+.4+(d7?.5:0),d7?3:1);const res=grantItem(r);
  S.coins+=coins;S.gems+=gems;S.stats.opened++;S.fresh=false;dirtySave=true;addXp(30+S.level*3);
  saveLocal();pushCloud(true);hud();return{res,coins,gems};
}
function openLevelChest(){
  if(S.lvlChests<=0)return null;S.lvlChests--;
  const coins=Math.round(Math.max(40,cps*60*(1+S.level*.02))),gems=rnd()<.12+S.level*.002?1+(rnd()<.2?1:0):0;
  let res=null;if(rnd()<Math.min(.65,.3+S.level*.005))res=grantItem(rollRarity(luckBase()+S.level*.012,0));
  S.coins+=coins;S.gems+=gems;S.stats.opened++;S.fresh=false;dirtySave=true;return{res,coins,gems};
}

  if(id==='spring'&&S.gems>=5&&t>=S.boostUntil){S.gems-=5;S.boostUntil=t+300000;toast('Brisa de primavera: 3× durante 5 minutos');puff(W/2,H*.5,['#cfe8a8','#f3efe2','#9ad65a'].map(hex),30,50,1.4)}
  else if(id==='bloom'&&S.gems>=6){S.gems-=6;let n=0;for(let i=0;i<3;i++)if(spawnFlower(true))n++;toast(n?`Nasceram ${n} flores`:'Ainda não há musgo que chegue para flores');if(!n)S.gems+=6}
  else if(id==='water'&&S.gems>=1){S.gems-=1;S.waterReady=0;doWater()}

}

}
function buyScene(bid){
  const bm=BIOMES.find(b=>b.id===bid);if(!bm||S.level<bm.lvl||S.coins<bm.cost||S.scenes.some(s=>s.biome===bid))return;
  S.coins-=bm.cost;calcIncome();SC().moss=encodeMoss();SC().tAct=now();S.scenes.push(newSceneData(bid));
  loadScene(S.scenes.length-1,false);closeSheet();hud();saveLocal();pushCloud(true);SND.play('level');ev('cena',bid);toast(`Nova cena: ${scene.name}`,'lvl');
}

function tick(dt){
  T+=dt;
  if(performance.now()-lastEnvT>20000||(preview&&performance.now()>preview.until)){lastEnvT=performance.now();refreshEnv()}

  econT+=dt;if(econT>.5){econT=0;calcIncome()}
  S.coins+=cps*dt;
  if(S.up.bugs>0&&!visiting){bugAcc+=bugRate()*dt;while(bugAcc>=1){bugAcc-=1;tapSpores(2);growXp(.5);S.stats.taps++}}
  const sd=SC();
  if(visiting){flowerT=Math.max(flowerT,5);debrisT=Math.max(debrisT,5)}
  flowerT-=dt;if(flowerT<=0){flowerT=(30+rnd()*40)/(1+S.up.bot*.1)*(season==='primavera'?.7:1);if(S.level>=2&&sd.flowers.length<Math.min(16,5+Math.floor(S.level/4)))spawnFlower()}
  debrisT-=dt;if(debrisT<=0){debrisT=(35+rnd()*45)*(season==='outono'?.7:1);if(sd.debris.length<4)spawnDebris()}
  if(S.up.hog>0&&!visiting){hogT-=dt;if(hogT<=0){hogT=70-6*S.up.hog;if(sd.debris.length)cleanDebris((rnd()*sd.debris.length)|0,null,null,true)}}
  visT-=dt;if(visT<=0){visT=20+rnd()*15;checkVisitors()}
  const pt=performance.now();
  for(const v of visitors){if(v.hop>0)v.hop=Math.max(0,v.hop-dt);if(pt>v.next){v.next=pt+500+rnd()*2400;v.fr=rnd()<.35?1:0;if(v.id==='pisco'&&rnd()<.25&&!RM){v.hop=.4;v.flip=!v.flip}}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>=p.life||p.y>H+4){parts.splice(i,1);continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.drop&&p.y>HOR+20+rnd()*120)parts.splice(i,1)}
  if(waterFlash>0)waterFlash=Math.max(0,waterFlash-dt*1.2);
  if(env.wx==='rain'&&!RM){for(const d of rain){d.y+=d.v*dt;d.x-=d.v*.12*dt;if(d.y>d.ty){if(rnd()<.35)parts.push({x:d.x,y:d.ty,vx:-8+rnd()*16,vy:-18,g:120,t:0,life:.25,c:[200,220,240],drop:0});d.y=-6-rnd()*30;d.x=rnd()*W*1.2;d.ty=HOR+rnd()*(H-HOR)}}}

  for(let i=leaves.length-1;i>=0;i--){const l=leaves[i];l.y+=l.vy*dt;l.x+=Math.sin(T*2+l.ph)*12*dt;if(l.y>l.ty)leaves.splice(i,1)}
  avTick(dt);
  if(!titleShown&&!visiting){chestT-=dt;if(chestT<=0){chestT=180+rnd()*240;spawnSceneChest()}}
  {const EV=eventoAtivo();if(EV&&!titleShown&&!visiting){evT-=dt;if(evT<=0){evT=35+rnd()*40;spawnEvItem(EV)}}else if(!EV&&evItems.length)evItems.length=0}
  sync(false);
  if(sceneChest&&performance.now()>sceneChest.until){puff(sceneChest.x,sceneChest.y-4,[[200,200,190]],6,14,.6);sceneChest=null}
  if(scene._chim&&!RM){smokeT-=dt;if(smokeT<=0){smokeT=.5+rnd()*.35;smoke.push({x:scene._chim.x+rnd()-.5,y:scene._chim.y,t:0,life:4+rnd()*2})}}

  lastWall=wall;const dt=Math.min(.25,gap/1000);lastT=t;

}
